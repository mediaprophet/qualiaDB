[package]
name = "qualia-qbdl-stream-conformance"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
sha2 = { version = "0.11.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
minicbor = { version = "2.3.1", features = ["std"] }
ed25519-dalek = { version = "3.0", default-features = false }
fips204 = { version = "0.4", default-features = false, features = ["ml-dsa-65", "default-rng"] }
hkdf = { version = "0.13", default-features = false }
hmac = { version = "0.13", default-features = false }
zeroize = "1.9.1"
aead = { version = "0.6", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
memmap2 = "0.9"
tempfile = "3"
libc = "0.2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_System_Rpc"] }
