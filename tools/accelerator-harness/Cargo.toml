[workspace]

[package]
name = "qualia-accelerator-harness"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = []
npu-openvino = ["dep:ort", "dep:tempfile"]

[dependencies]
etalon-agent = { version = "0.0.2", git = "https://github.com/mediaprophet/etalon.git", rev = "969f32fc745dcffe89d996c1b4b96f285839e946" }
vibe = { path = "../../crates/vibe" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"], optional = true }
tempfile = { version = "3.27", optional = true }

[profile.dev]
debug = 0
incremental = false

[patch."https://github.com/mediaprophet/vibe-script.git"]
vibescript-abi = { path = "../../crates/vibescript-abi" }
