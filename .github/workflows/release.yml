name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ── Job 1: qualia-cli ─────────────────────────────────────────────────────────
jobs:
  build-cli:
    name: CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: target/release/qualia-cli
            asset_name: qualia-cli-linux-x86_64
          - os: windows-latest
            artifact: target/release/qualia-cli.exe
            asset_name: qualia-cli-windows-x86_64.exe
          - os: macos-14
            artifact: target/release/qualia-cli
            asset_name: qualia-cli-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cli-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cli-

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Build qualia-cli
        run: cargo build --release -p qualia-cli

      - name: Rename artifact
        shell: bash
        run: cp ${{ matrix.artifact }} ${{ matrix.asset_name }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DirectML.dll (Windows CLI)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: vendor/directml/bin/x64-win/DirectML.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ── Job 2: WASM smoke-check (fast, catches wasm32 compile errors before full build) ──
  check-wasm:
    name: WASM smoke-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-check-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: wasm-check-cargo-
      - name: WASM smoke-check
        run: cargo check --target wasm32-unknown-unknown -p qualia-core-db

# ── Job 3: qualia-core-db WASM ────────────────────────────────────────────────
  build-wasm:
    needs: check-wasm
    name: WASM (qualia-core-db)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: wasm-cargo-

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1 --force

      - name: Build WASM package
        run: |
          wasm-pack build crates/qualia-core-db \
            --target web \
            --release \
            --out-dir ../../docs/playground \
            --out-name qualia_core_db \
            --no-typescript

      - name: Package WASM artifacts (GitHub Pages compatible)
        run: |
          mkdir -p release-assets/qualia-core-wasm
          cp docs/playground/qualia_core_db.js release-assets/qualia-core-wasm/
          cp docs/playground/qualia_core_db_bg.wasm release-assets/qualia-core-wasm/
          tar -czf qualia-core-wasm-pages.tar.gz -C release-assets qualia-core-wasm

      - name: Package WASM artifacts (raw wasm-pack pkg)
        run: tar -czf qualia-core-wasm.tar.gz -C docs/playground qualia_core_db.js qualia_core_db_bg.wasm

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            qualia-core-wasm.tar.gz
            qualia-core-wasm-pages.tar.gz
            docs/playground/qualia_core_db.js
            docs/playground/qualia_core_db_bg.wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ── Job 4: Princeton WordNet dataset (release asset, not git/LFS) ───────────────
  build-datasets:
    name: Datasets (Princeton WordNet)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-datasets-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-datasets-

      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config curl

      - name: Download Princeton WordNet RDF (optional)
        id: rdf
        env:
          WORDNET_RDF_URL: ${{ secrets.WORDNET_RDF_URL }}
        run: |
          mkdir -p .wordnet_build
          if [[ -n "$WORDNET_RDF_URL" ]]; then
            echo "Downloading RDF from WORDNET_RDF_URL secret..."
            curl -fL --progress-bar -o .wordnet_build/wordnet.rdf "$WORDNET_RDF_URL"
            echo "path=.wordnet_build/wordnet.rdf" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "WORDNET_RDF_URL not set — skipping dataset build."
            echo "Upload princeton.q42 manually or set the repository secret."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build princeton.q42
        if: steps.rdf.outputs.ready == 'true'
        env:
          QUALIA_PRINCETON_RDF: ${{ steps.rdf.outputs.path }}
        run: |
          bash scripts/ingest_princeton_wordnet.sh
          ls -lh docs/data/wordnet/princeton.q42

      - name: Upload princeton.q42 to release
        if: steps.rdf.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: docs/data/wordnet/princeton.q42
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Flutter desktop packaging moved to WebizenAI repo — see Local_LIbraries/EXPORTS/qualia-flutter-desktop/
