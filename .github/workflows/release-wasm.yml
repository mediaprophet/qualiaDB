name: WASM Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload assets to, for example v0.0.24"
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-wasm:
    name: WASM smoke-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-check-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: wasm-check-cargo-

      - name: WASM smoke-check (portal slim)
        run: |
          cargo check -q --target wasm32-unknown-unknown -p qualia-core-db \
            --no-default-features --features portal

      - name: WASM capability profile checks
        run: |
          cargo check -q --target wasm32-unknown-unknown -p webizen-lite-wasm
          cargo check -q --target wasm32-unknown-unknown -p qualia-core-db \
            --no-default-features --features wasm-logic
          cargo check -q --target wasm32-unknown-unknown -p qualia-core-db \
            --no-default-features --features wasm-scientific
          cargo check -q --target wasm32-unknown-unknown -p qualia-core-db \
            --no-default-features --features wasm-llm

  build-portal-wasm:
    needs: check-wasm
    name: WASM (Qualia Portal)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-portal-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: wasm-portal-cargo-

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1 --force

      - name: Build Qualia portal WASM (viewport + acoustic, slim)
        env:
          RUSTFLAGS: "-C target-feature=+simd128"
        run: |
          wasm-pack build crates/qualia-core-db \
            --target web \
            --release \
            --out-dir pkg-qualia \
            -- --no-default-features --features portal
          mkdir -p docs/pkg/qualia
          cp crates/qualia-core-db/pkg-qualia/qualia_core_db.js docs/pkg/qualia/qualia.js
          cp crates/qualia-core-db/pkg-qualia/qualia_core_db_bg.wasm docs/pkg/qualia/qualia_bg.wasm
          cp crates/qualia-core-db/pkg-qualia/qualia_core_db.d.ts docs/pkg/qualia/qualia.d.ts
          cp crates/qualia-core-db/pkg-qualia/qualia_core_db_bg.wasm.d.ts docs/pkg/qualia/qualia_bg.wasm.d.ts 2>/dev/null || true
          bash scripts/patch-portal-wasm-js.sh docs/pkg/qualia/qualia.js
          printf '%s\n' '{"name":"qualia-portal","type":"module","version":"0.0.18","main":"qualia.js","types":"qualia.d.ts"}' > docs/pkg/qualia/package.json

      - name: Portal WASM size budget
        run: node docs/tests/wasm-size-check.mjs docs/pkg/qualia/qualia_bg.wasm

      - name: Build ontology MCP WASM
        run: |
          wasm-pack build crates/webizen-lite-wasm \
            --target web \
            --release \
            --out-dir ../../docs/pkg/webizen-lite
          node docs/tests/wasm-size-check.mjs \
            docs/pkg/webizen-lite/webizen_lite_wasm_bg.wasm 524288 204800

      - name: Phenomenal viewport contract checklist
        run: node docs/tests/phenomenal-verify.mjs --wasm-api docs/pkg/qualia/qualia.d.ts

      - name: Package Qualia Portal release assets
        run: |
          mkdir -p release-assets/qualia-portal
          cp docs/pkg/qualia/qualia.js release-assets/qualia-portal/
          cp docs/pkg/qualia/qualia_bg.wasm release-assets/qualia-portal/
          cp docs/pkg/qualia/qualia.d.ts release-assets/qualia-portal/
          cp docs/pkg/qualia/package.json release-assets/qualia-portal/
          tar -czf qualia-portal-wasm.tar.gz -C release-assets qualia-portal
          tar -czf webizen-lite-wasm.tar.gz -C docs/pkg webizen-lite

      - name: Upload Qualia Portal WASM to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            qualia-portal-wasm.tar.gz
            docs/pkg/qualia/qualia.js
            docs/pkg/qualia/qualia_bg.wasm
            docs/pkg/qualia/qualia.d.ts
            docs/pkg/qualia/package.json
            webizen-lite-wasm.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-playground-wasm:
    needs: check-wasm
    name: WASM (playground wasm-full)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-playground-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: wasm-playground-cargo-

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1 --force

      - name: Build full playground WASM
        env:
          RUSTFLAGS: "-C target-feature=+simd128 -C link-arg=-zstack-size=8388608 -C link-arg=--max-memory=4294967296"
        run: |
          wasm-pack build crates/qualia-core-db \
            --target web \
            --release \
            --out-dir ../../docs/playground \
            --out-name qualia_core_db \
            --no-typescript \
            -- --no-default-features --features wasm-full

      - name: Package playground release assets
        run: |
          mkdir -p release-assets/qualia-core-wasm
          cp docs/playground/qualia_core_db.js release-assets/qualia-core-wasm/
          cp docs/playground/qualia_core_db_bg.wasm release-assets/qualia-core-wasm/
          tar -czf qualia-core-wasm-pages.tar.gz -C release-assets qualia-core-wasm
          tar -czf qualia-core-wasm.tar.gz -C docs/playground qualia_core_db.js qualia_core_db_bg.wasm

      - name: Upload playground WASM to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            qualia-core-wasm.tar.gz
            qualia-core-wasm-pages.tar.gz
            docs/playground/qualia_core_db.js
            docs/playground/qualia_core_db_bg.wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-anatomy-packs:
    name: Anatomy .hmc asset packs
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: anatomy-packs-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: anatomy-packs-cargo-

      - name: Build complete anatomy packs (XY + XX) from the HRA
        # Every discovered CCF/HRA reference organ (CC-BY-4.0) → sealed `.10d` → one transparent
        # `.hmc` bundle per model. Fetches the HRA CDN once, here, so the Pages deploy pulls
        # the prebuilt packs from this Release instead of re-fetching the CDN every build.
        run: |
          mkdir -p release-assets/anatomy
          cargo run --release -p qualia-client-core --example build_anatomy_pack -- build both release-assets/anatomy
          cargo run --release -p qualia-client-core --example build_anatomy_pack -- verify both release-assets/anatomy
          ls -lh release-assets/anatomy/anatomy-*.hmc release-assets/anatomy/anatomy-*.q42

      - name: Upload anatomy packs to release
        # Each model ships as its `.hmc` bundle PLUS a byte-identical `.q42` provenance/semantics
        # sidecar (the bundle's own body.q42 entry, extracted for direct linking by the copyright panel).
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            release-assets/anatomy/anatomy-male.hmc
            release-assets/anatomy/anatomy-female.hmc
            release-assets/anatomy/anatomy-male.q42
            release-assets/anatomy/anatomy-female.q42
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the BodyParts3D complete ontology + mesh pack (CC-BY-SA)
        # The FMA-keyed muscles / bones / glands / nerves CCF lacks — every mesh structure as an
        # addressable ONTOLOGY (`.q42`: OBO FMA IRIs + is-a + part-of + system + geometry) plus a `.10d`
        # mesh library it cites, in one CC-BY-SA `.hmc`. Large (~1.3 GB of source STL). `all 0 0` =
        # every system, no count cap, no size cap. Runs AFTER the CCF upload so a BodyParts3D hiccup does
        # not block the permissive packs. The producer reports per-structure failures without aborting.
        run: |
          cargo run --release -p qualia-client-core --example build_anatomy_pack -- bodyparts release-assets/anatomy all 0 0
          ls -lh release-assets/anatomy/anatomy-bodyparts3d.hmc release-assets/anatomy/anatomy-bodyparts3d.q42

      - name: Upload the BodyParts3D pack to release
        # A Release asset only — the pack exceeds GitHub Pages' 100 MB/file limit, so the demo's
        # "Complete body (BodyParts3D)" toggle fetches it on demand from the Release download URL.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            release-assets/anatomy/anatomy-bodyparts3d.hmc
            release-assets/anatomy/anatomy-bodyparts3d.q42
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
