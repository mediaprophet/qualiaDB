name: WASM Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload assets to, for example v0.0.38"
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-wasm:
    name: WASM smoke-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-check-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: wasm-check-cargo-

      - name: WASM smoke-check (portal)
        run: |
          cargo check -q --target wasm32-unknown-unknown -p qualia-core-db \
            --no-default-features --features portal

      - name: WASM capability profile checks
        run: |
          cargo check -q --target wasm32-unknown-unknown -p webizen-lite-wasm
          cargo check -q --target wasm32-unknown-unknown -p qualia-core-db \
            --no-default-features --features wasm-logic
          cargo check -q --target wasm32-unknown-unknown -p qualia-core-db \
            --no-default-features --features wasm-scientific
          cargo check -q --target wasm32-unknown-unknown -p qualia-core-db \
            --no-default-features --features wasm-llm

  build-portal-wasm:
    needs: check-wasm
    name: WASM (Qualia Portal)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-portal-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: wasm-portal-cargo-

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1 --force

      - name: Build Qualia portal WASM (full browser engine)
        env:
          RUSTFLAGS: "-C target-feature=+simd128"
        run: |
          wasm-pack build crates/qualia-core-db \
            --target web \
            --release \
            --out-dir pkg-qualia \
            -- --no-default-features --features portal
          mkdir -p docs/pkg/qualia
          cp crates/qualia-core-db/pkg-qualia/qualia_core_db.js docs/pkg/qualia/qualia.js
          cp crates/qualia-core-db/pkg-qualia/qualia_core_db_bg.wasm docs/pkg/qualia/qualia_bg.wasm
          cp crates/qualia-core-db/pkg-qualia/qualia_core_db.d.ts docs/pkg/qualia/qualia.d.ts
          cp crates/qualia-core-db/pkg-qualia/qualia_core_db_bg.wasm.d.ts docs/pkg/qualia/qualia_bg.wasm.d.ts 2>/dev/null || true
          cp crates/qualia-core-db/LICENSE docs/pkg/qualia/LICENSE
          bash scripts/patch-portal-wasm-js.sh docs/pkg/qualia/qualia.js
          printf '%s\n' '{"name":"qualia-portal","type":"module","version":"0.0.38","main":"qualia.js","types":"qualia.d.ts"}' > docs/pkg/qualia/package.json

      - name: Portal WASM size budget
        # Sanity cap for the full WASM-safe engine (not a slim product budget).
        # Measured 0.0.38 portal: ~7.70 MiB raw / ~2.15 MiB gzip (node gzipSync).
        # Ontology MCP keeps the tight 640 KiB / 200 KiB gate.
        run: node docs/tests/wasm-size-check.mjs docs/pkg/qualia/qualia_bg.wasm 16777216 4194304

      - name: Build ontology MCP WASM
        run: |
          wasm-pack build crates/webizen-lite-wasm \
            --target web \
            --release \
            --out-dir ../../docs/pkg/webizen-lite
          # Raw 640 KiB / gzip 200 KiB. Raw was raised from 512 KiB once the session query +
          # deontic bridge + MCP discovery tools landed; gzip is the wire size and stays the
          # binding constraint (currently ~161 KiB).
          node docs/tests/wasm-size-check.mjs \
            docs/pkg/webizen-lite/webizen_lite_wasm_bg.wasm 655360 204800

      - name: Phenomenal viewport contract checklist
        run: node docs/tests/phenomenal-verify.mjs --wasm-api docs/pkg/qualia/qualia.d.ts

      - name: Package Qualia Portal release assets
        run: |
          mkdir -p release-assets/qualia-portal
          cp docs/pkg/qualia/qualia.js release-assets/qualia-portal/
          cp docs/pkg/qualia/qualia_bg.wasm release-assets/qualia-portal/
          cp docs/pkg/qualia/qualia.d.ts release-assets/qualia-portal/
          cp docs/pkg/qualia/package.json release-assets/qualia-portal/
          cp docs/pkg/qualia/LICENSE release-assets/qualia-portal/
          tar -czf qualia-portal-wasm.tar.gz -C release-assets qualia-portal
          tar -czf webizen-lite-wasm.tar.gz -C docs/pkg webizen-lite

      - name: Upload Qualia Portal WASM to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            qualia-portal-wasm.tar.gz
            docs/pkg/qualia/qualia.js
            docs/pkg/qualia/qualia_bg.wasm
            docs/pkg/qualia/qualia.d.ts
            docs/pkg/qualia/package.json
            webizen-lite-wasm.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-playground-wasm:
    needs: check-wasm
    name: WASM (playground wasm-full)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-playground-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: wasm-playground-cargo-

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1 --force

      - name: Build full playground WASM
        env:
          RUSTFLAGS: "-C target-feature=+simd128 -C link-arg=-zstack-size=8388608 -C link-arg=--max-memory=4294967296"
        run: |
          wasm-pack build crates/qualia-core-db \
            --target web \
            --release \
            --out-dir ../../docs/playground \
            --out-name qualia_core_db \
            --no-typescript \
            -- --no-default-features --features wasm-full

      - name: Playground WASM size budget
        # Same 16 MiB / 4 MiB sanity cap as portal. Measured 0.0.38 wasm-full:
        # ~8.23 MiB raw / ~2.32 MiB gzip. Keep in step with pages.yml.
        run: node docs/tests/wasm-size-check.mjs docs/playground/qualia_core_db_bg.wasm 16777216 4194304

      - name: Package playground release assets
        run: |
          mkdir -p release-assets/qualia-core-wasm
          cp docs/playground/qualia_core_db.js release-assets/qualia-core-wasm/
          cp docs/playground/qualia_core_db_bg.wasm release-assets/qualia-core-wasm/
          tar -czf qualia-core-wasm-pages.tar.gz -C release-assets qualia-core-wasm
          tar -czf qualia-core-wasm.tar.gz -C docs/playground qualia_core_db.js qualia_core_db_bg.wasm LICENSE

      - name: Upload playground WASM to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            qualia-core-wasm.tar.gz
            qualia-core-wasm-pages.tar.gz
            docs/playground/qualia_core_db.js
            docs/playground/qualia_core_db_bg.wasm
            docs/playground/LICENSE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

