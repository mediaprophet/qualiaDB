name: Deploy Qualia-DB Playground to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-pages-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-pages-

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gzip curl

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1 --force

      - name: WASM smoke-check (qualia-core-db)
        run: cargo check --target wasm32-unknown-unknown -p qualia-core-db

      - name: Build WASM (qualia-core-db)
        run: |
          wasm-pack build crates/qualia-core-db \
            --target web \
            --release \
            --out-dir ../../docs/playground \
            --out-name qualia_core_db \
            --no-typescript
          ls -la docs/playground/qualia_core_db.js docs/playground/qualia_core_db_bg.wasm

      - name: Prepare Schema.org benchmark artifacts for Pages
        continue-on-error: true   # non-fatal: Pages deploys fine without Schema.org artifacts
        run: |
          bash scripts/prepare_schemaorg_benchmark.sh 30.0 current-https

      - name: Wire Princeton WordNet for Pages demo
        continue-on-error: true
        run: |
          if [[ -f docs/data/wordnet/princeton.q42 ]]; then
            cp docs/data/wordnet/princeton.q42 docs/playground/wordnet.q42
            ls -lh docs/data/wordnet/princeton.q42 docs/playground/wordnet.q42
          elif [[ -n "${QUALIA_PRINCETON_RDF:-}" && -f "$QUALIA_PRINCETON_RDF" ]]; then
            bash scripts/ingest_princeton_wordnet.sh
          else
            echo "WARN: princeton.q42 missing — falling back to 100k OEWN subset"
            bash scripts/fetch_wordnet.sh --subset 100000 --playground
            ls -lh docs/playground/wordnet.q42
          fi

      - name: Build W3C ontology volumes for Ontology Demo
        continue-on-error: true
        run: |
          bash scripts/prepare_w3c_ontologies.sh
          ls -lh docs/data/w3c/*.q42 | head

      - name: Build W3C archives ontology volumes for Ontology Demo
        continue-on-error: true
        run: |
          bash scripts/prepare_w3c_archives.sh
          ls -lh docs/data/w3c-archives/*.q42 | head

      - name: Build PURL ontology volumes for Ontology Demo
        continue-on-error: true
        run: |
          bash scripts/prepare_purl_ontologies.sh
          ls -lh docs/data/purl/*.q42 | head

      - name: Build GeoNames ontology volume for Ontology Demo
        continue-on-error: true
        run: |
          bash scripts/prepare_geonames_ontologies.sh
          ls -lh docs/data/geonames/*.q42

      - name: Build Dublin Core ontology volume for Ontology Demo
        continue-on-error: true
        run: |
          bash scripts/prepare_dublincore_ontologies.sh
          ls -lh docs/data/dublincore/*.q42

      - name: Build FIBO domain volumes for Ontology Demo
        continue-on-error: true
        run: |
          pip install rdflib
          bash scripts/prepare_fibo_ontologies.sh
          ls -lh docs/data/fibo/*.q42 | head

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Rust documentation
        run: cargo doc --no-deps -p qualia-core-db -p qualia-cli -p qualia-client-core

      - name: Stage Rust docs into Jekyll source
        run: cp -r target/doc docs/rustdoc

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
