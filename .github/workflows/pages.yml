name: Deploy Qualia-DB Playground to GitHub Pages

# Deploys Jekyll site under /docs to GitHub Pages (baseurl: /qualiaDB).
# Triggers: main, active release branch 0.0.26, version tags, or manual run.
# Environment github-pages must also allow the branch (deployment branch policies).
on:
  push:
    branches:
      - main
      - "0.0.26"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  QUALIA_GITHUB_REPO: mediaprophet/qualiaDB

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-pages-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-pages-

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gzip curl

      - name: Install wasm-pack
        run: |
          set -euo pipefail
          WASM_PACK_VERSION=0.13.1
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) WASM_PACK_ARCH=x86_64-unknown-linux-musl ;;
            aarch64|arm64) WASM_PACK_ARCH=aarch64-unknown-linux-musl ;;
            *) echo "unsupported runner arch: $ARCH"; exit 1 ;;
          esac
          TARBALL="wasm-pack-v${WASM_PACK_VERSION}-${WASM_PACK_ARCH}.tar.gz"
          URL="https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${TARBALL}"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "/tmp/${TARBALL}" "$URL"
          tar -xzf "/tmp/${TARBALL}" -C /tmp
          install -m 0755 "/tmp/wasm-pack-v${WASM_PACK_VERSION}-${WASM_PACK_ARCH}/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version

      - name: WASM smoke-check (portal slim)
        run: |
          cargo check -q --target wasm32-unknown-unknown -p qualia-core-db \
            --no-default-features --features portal

      - name: WASM capability profile checks
        run: |
          cargo check -q --target wasm32-unknown-unknown -p webizen-lite-wasm
          cargo check -q --target wasm32-unknown-unknown -p qualia-core-db \
            --no-default-features --features wasm-logic
          cargo check -q --target wasm32-unknown-unknown -p qualia-core-db \
            --no-default-features --features wasm-scientific
          cargo check -q --target wasm32-unknown-unknown -p qualia-core-db \
            --no-default-features --features wasm-llm

      - name: Build ontology MCP WASM
        run: |
          wasm-pack build crates/webizen-lite-wasm \
            --target web \
            --release \
            --out-dir ../../docs/pkg/webizen-lite
          node docs/tests/wasm-size-check.mjs \
            docs/pkg/webizen-lite/webizen_lite_wasm_bg.wasm 524288 204800
          ls -la docs/pkg/webizen-lite/webizen_lite_wasm.js \
            docs/pkg/webizen-lite/webizen_lite_wasm_bg.wasm

      - name: Build Qualia portal WASM (viewport + acoustic, slim)
        env:
          # Slim viewport+acoustic bundle loaded by every spatial page via qualia-shell.js /
          # qualia-wasm-runtime.js — kept under the 2 MB / 800 KB size budget below. The browser LLM
          # ships in the wasm-full *playground* bundle instead (online-llm-demo / wasm-llm-test / llmdemo).
          RUSTFLAGS: "-C target-feature=+simd128"
          PORTAL_FEATURES: "portal"
        run: |
          wasm-pack build crates/qualia-core-db \
            --target web \
            --release \
            --out-dir pkg-qualia \
            -- --no-default-features --features "${PORTAL_FEATURES}"
          mkdir -p docs/pkg/qualia
          cp crates/qualia-core-db/pkg-qualia/qualia_core_db.js docs/pkg/qualia/qualia.js
          cp crates/qualia-core-db/pkg-qualia/qualia_core_db_bg.wasm docs/pkg/qualia/qualia_bg.wasm
          cp crates/qualia-core-db/pkg-qualia/qualia_core_db.d.ts docs/pkg/qualia/qualia.d.ts
          cp crates/qualia-core-db/pkg-qualia/qualia_core_db_bg.wasm.d.ts docs/pkg/qualia/qualia_bg.wasm.d.ts 2>/dev/null || true
          bash scripts/patch-portal-wasm-js.sh docs/pkg/qualia/qualia.js
          printf '%s\n' '{"name":"qualia-portal","type":"module","version":"0.0.26","main":"qualia.js","types":"qualia.d.ts"}' > docs/pkg/qualia/package.json
          ls -la docs/pkg/qualia/qualia.js docs/pkg/qualia/qualia_bg.wasm docs/pkg/qualia/qualia.d.ts
          grep -q 'qualia_bg.wasm' docs/pkg/qualia/qualia.js

      - name: Phase 7.1 — portal WASM size budget
        run: node docs/tests/wasm-size-check.mjs docs/pkg/qualia/qualia_bg.wasm

      - name: PR-C11b — phenomenal viewport contract checklist
        run: node docs/tests/phenomenal-verify.mjs --wasm-api docs/pkg/qualia/qualia.d.ts

      - name: Anatomy .hmc packs (prefer Release, fall back to building from the HRA)
        # The packs (XY + XX, ~100 MB each — every CCF/HRA reference organ) are Release
        # artefacts, produced once per release by build-anatomy-packs in release-wasm.yml.
        # Prefer pulling them from our own GitHub Release so the deploy doesn't re-hit the HRA
        # CDN every build (the bandwidth fix); if no released packs exist yet, build them once
        # so the demo still works. The online 3D anatomy demo (playground/anatomy.html) fetches
        # these and renders the real body via the portal WASM.
        run: |
          if bash scripts/fetch_anatomy_packs_release.sh; then
            echo "anatomy packs fetched from Release"
          else
            echo "no released anatomy packs found — building once from the HRA…"
            cargo run --release -p qualia-client-core --example build_anatomy_pack -- build both docs/playground
          fi
          ls -lh docs/playground/anatomy-male.hmc docs/playground/anatomy-female.hmc
          # The `.q42` provenance sidecars ride along (linked by the copyright panel); optional on older releases.
          ls -lh docs/playground/anatomy-*.q42 2>/dev/null || echo "(no .q42 provenance sidecars this build)"

      - name: Build full WASM (playground / API explorer)
        env:
          # wasm-full includes wasm-llm → same 8 MB stack / 4 GB max-memory requirement as above.
          RUSTFLAGS: "-C target-feature=+simd128 -C link-arg=-zstack-size=8388608 -C link-arg=--max-memory=4294967296"
        run: |
          wasm-pack build crates/qualia-core-db \
            --target web \
            --release \
            --out-dir ../../docs/playground \
            --out-name qualia_core_db \
            --no-typescript \
            -- --no-default-features --features wasm-full
          ls -la docs/playground/qualia_core_db.js docs/playground/qualia_core_db_bg.wasm

      - name: Prepare Schema.org benchmark artifacts for Pages
        continue-on-error: true   # non-fatal: Pages deploys fine without Schema.org artifacts
        run: |
          bash scripts/prepare_schemaorg_benchmark.sh 30.0 current-https

      - name: Fetch Princeton WordNet from GitHub Release
        run: |
          bash scripts/fetch_wordnet_release.sh
          test -f docs/data/wordnet/princeton.q42
          test -f docs/playground/wordnet.q42
          ls -lh docs/data/wordnet/princeton.q42 docs/playground/wordnet.q42
          # Verify Q42 v3 magic so Pages never ships a stale HTML/404 body
          python3 - <<'PY'
          import pathlib, sys
          p = pathlib.Path("docs/data/wordnet/princeton.q42")
          magic = p.read_bytes()[:4]
          if magic != b"Q42\x00":
              sys.exit(f"invalid Q42 magic in {p}: {magic!r}")
          print(f"OK: {p.name} magic Q42\\\\0, size {p.stat().st_size:,} B")
          PY

      # Ontology volume builds are intentionally SOFT (continue-on-error): each
      # runs `cargo run --release -p qualia-cli ingest`, a heavy compile that
      # must never block a docs deploy, and the Ontology Demo degrades gracefully
      # to its hard-gated Princeton WordNet dataset when a volume is absent. The
      # "Verify ontology volumes" step below surfaces any missing group as a
      # ::warning:: so soft failures are visible rather than silent. (Decision:
      # WASM_PAGES_AUDIT §4.3.)
      - name: Build W3C ontology volumes for Ontology Demo
        continue-on-error: true
        run: |
          bash scripts/prepare_w3c_ontologies.sh
          ls -lh docs/data/w3c/*.q42 | head

      - name: Build W3C archives ontology volumes for Ontology Demo
        continue-on-error: true
        run: |
          bash scripts/prepare_w3c_archives.sh
          ls -lh docs/data/w3c-archives/*.q42 | head

      - name: Build PURL ontology volumes for Ontology Demo
        continue-on-error: true
        run: |
          bash scripts/prepare_purl_ontologies.sh
          ls -lh docs/data/purl/*.q42 | head

      - name: Build GeoNames ontology volume for Ontology Demo
        continue-on-error: true
        run: |
          bash scripts/prepare_geonames_ontologies.sh
          ls -lh docs/data/geonames/*.q42

      - name: Build Dublin Core ontology volume for Ontology Demo
        continue-on-error: true
        run: |
          bash scripts/prepare_dublincore_ontologies.sh
          ls -lh docs/data/dublincore/*.q42

      - name: Build FIBO domain volumes for Ontology Demo
        continue-on-error: true
        run: |
          pip install rdflib
          bash scripts/prepare_fibo_ontologies.sh
          ls -lh docs/data/fibo/*.q42 | head

      - name: Verify ontology volumes (non-fatal summary)
        # Makes the soft ontology builds above visible: warns (does not fail) for
        # any group that produced no .q42 volumes. See WASM_PAGES_AUDIT §4.3.
        if: always()
        run: |
          missing=0
          for grp in w3c w3c-archives purl geonames dublincore fibo; do
            n=$(ls docs/data/$grp/*.q42 2>/dev/null | wc -l)
            if [ "$n" -gt 0 ]; then
              echo "ontology volumes: $grp = $n .q42 file(s)"
            else
              echo "::warning title=Ontology volume missing::no .q42 volumes built for '$grp'; Ontology Demo falls back to WordNet"
              missing=$((missing + 1))
            fi
          done
          echo "ontology volume groups missing: $missing of 6"

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build docs Tailwind CSS (replaces Play CDN)
        run: |
          cd docs
          npm ci
          npm run build:tailwind
          test -f css/tailwind-built.css

      - name: Build Rust documentation
        run: cargo doc --no-deps -p qualia-core-db -p qualia-cli -p qualia-client-core

      - name: Stage Rust docs into Jekyll source
        run: cp -r target/doc docs/rustdoc

      - name: Cache-bust hashed assets (?v= on tailwind-built.css)
        # Stamp deploy-only ?v= query strings on the Jekyll *source* tree after
        # tailwind-built.css exists. actions/jekyll-build-pages emits a read-only
        # _site (EACCES on writeFileSync), so we must not post-process _site.
        # Committed docs/*.html stay diff-clean; only the CI workspace is stamped.
        run: node docs/scripts/stamp-asset-versions.mjs docs

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
