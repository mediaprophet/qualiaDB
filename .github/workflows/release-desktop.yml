name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload assets to, for example v0.0.24"
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-desktop-windows:
    name: Desktop (Windows Webizen)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.8.0-alpha.0 --locked

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-desktop-

      - name: Build and verify packaged webizen-studio dist
        shell: pwsh
        run: |
          .\scripts\build_frontend.ps1
          $dist = "crates/webizen-studio/dist"
          $portal = "crates/webizen-desktop/static/portal"
          if (-not (Test-Path "$dist/index.html")) {
            throw "$dist/index.html missing"
          }
          if (-not (Get-ChildItem "$dist/assets" -Filter "*.js" -File -ErrorAction SilentlyContinue)) {
            throw "$dist/assets is missing a JavaScript bundle"
          }
          if (-not (Get-ChildItem "$dist/assets" -Filter "*.wasm" -File -ErrorAction SilentlyContinue)) {
            throw "$dist/assets is missing a WASM bundle"
          }
          if (-not (Test-Path "$portal/index.html")) {
            throw "$portal/index.html missing"
          }
          if (-not (Test-Path "$portal/design-studio.html")) {
            throw "$portal/design-studio.html missing"
          }
          $expectedRevision = (git rev-parse HEAD).Trim()
          $builtRevision = (Get-Content "$dist/source-revision.txt" -Raw).Trim()
          if ($builtRevision -ne $expectedRevision) {
            throw "Frontend revision $builtRevision does not match source revision $expectedRevision"
          }
          Get-ChildItem $dist, "$dist/assets"

      - name: Verify updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY secret is required to produce signed updater artifacts"
          }

      - name: Build installer and signed updater artifacts
        working-directory: crates/webizen-desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $buildLog = cargo tauri build --ci --bundles nsis 2>&1 | Tee-Object -Variable lines
          $exitCode = $LASTEXITCODE
          $lines | Set-Content -Path tauri-build.log
          if ($exitCode -ne 0) {
            throw "cargo tauri build failed with exit code $exitCode"
          }
          if (Select-String -Path tauri-build.log -Pattern "does not match the public key") {
            throw "TAURI_SIGNING_PRIVATE_KEY does not match the updater pubkey in tauri.conf.json"
          }

      - name: Stage desktop bundle
        shell: pwsh
        run: |
          $out = "release-assets/webizen-desktop-windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = @("target/release/webizen-desktop.exe", "crates/webizen-desktop/target/release/webizen-desktop.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "webizen-desktop.exe missing after Tauri build" }
          Copy-Item $exe $out/
          if (Test-Path vendor/directml/bin/x64-win/DirectML.dll) {
            Copy-Item vendor/directml/bin/x64-win/DirectML.dll $out/
          }
          if (Test-Path vendor/dxc/bin/x64-win/dxcompiler.dll) {
            Copy-Item vendor/dxc/bin/x64-win/dxcompiler.dll $out/
            Copy-Item vendor/dxc/bin/x64-win/dxil.dll $out/ -ErrorAction SilentlyContinue
          }
          if (Test-Path crates/webizen-studio/dist) {
            Copy-Item -Recurse crates/webizen-studio/dist $out/studio-dist
          }
          Copy-Item -Recurse crates/webizen-desktop/static/portal $out/portal
          tar -a -cf webizen-desktop-windows-x64.zip -C release-assets webizen-desktop-windows-x64
          $installerOut = "release-assets/desktop-windows-installer"
          New-Item -ItemType Directory -Force -Path $installerOut | Out-Null
          $bundleRoots = @("target/release/bundle", "crates/webizen-desktop/target/release/bundle")
          $bundleFiles = foreach ($root in $bundleRoots) {
            if (Test-Path $root) {
              Get-ChildItem $root -Recurse -File -Include *.exe,*.msi,*.zip,*.sig
            }
          }
          if (-not $bundleFiles) { throw "No Tauri Windows bundle artifacts found" }
          foreach ($file in $bundleFiles) {
            Copy-Item $file.FullName (Join-Path $installerOut $file.Name) -Force
          }
          if (-not (Get-ChildItem $installerOut -Filter "*.sig" -File -ErrorAction SilentlyContinue)) {
            throw "No signed Windows updater artifacts were produced"
          }
          Get-ChildItem $out, $installerOut, webizen-desktop-windows-x64.zip

      - name: Upload desktop artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-artifacts
          path: |
            webizen-desktop-windows-x64.zip
            release-assets/desktop-windows-installer/*

      - name: Upload desktop to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            webizen-desktop-windows-x64.zip
            release-assets/desktop-windows-installer/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-macos-metal:
    name: Desktop (macOS Apple Silicon / Metal)
    runs-on: macos-14
    env:
      WGPU_BACKEND: metal
      WGPU_POWER_PREF: high
      RUSTFLAGS: "-C target-cpu=apple-m1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, wasm32-unknown-unknown

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.8.0-alpha.0 --locked

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-metal-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-desktop-metal-

      - name: Build and verify packaged webizen-studio dist
        shell: bash
        run: |
          bash scripts/build_frontend.sh
          dist="crates/webizen-studio/dist"
          portal="crates/webizen-desktop/static/portal"
          test -f "$dist/index.html"
          find "$dist/assets" -maxdepth 1 -type f -name '*.js' | grep -q .
          find "$dist/assets" -maxdepth 1 -type f -name '*.wasm' | grep -q .
          test -f "$portal/index.html"
          test -f "$portal/design-studio.html"
          test "$(cat "$dist/source-revision.txt")" = "$(git rev-parse HEAD)"
          ls -lah "$dist" "$dist/assets"

      - name: Verify updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is required to produce signed updater artifacts"
            exit 1
          fi

      - name: Build macOS Metal installer and signed updater artifacts
        working-directory: crates/webizen-desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          cargo tauri build --ci --target aarch64-apple-darwin --bundles app,dmg 2>&1 | tee tauri-build.log
          if grep -q "does not match the public key" tauri-build.log; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY does not match the updater pubkey in tauri.conf.json"
            exit 1
          fi

      - name: Stage macOS Metal desktop bundle
        shell: bash
        run: |
          out="release-assets/webizen-desktop-macos-aarch64-metal"
          rm -rf "$out"
          mkdir -p "$out"
          exe=""
          for candidate in "target/aarch64-apple-darwin/release/webizen-desktop" "crates/webizen-desktop/target/aarch64-apple-darwin/release/webizen-desktop"; do
            if [ -f "$candidate" ]; then exe="$candidate"; break; fi
          done
          test -n "$exe"
          cp "$exe" "$out/"
          cp -R crates/webizen-studio/dist "$out/studio-dist"
          cp -R crates/webizen-desktop/static/portal "$out/portal"
          cat > "$out/README.txt" <<'EOF'
          Webizen Desktop for macOS Apple Silicon (M1 or newer)

          This build targets aarch64-apple-darwin with wgpu's native Metal backend.
          Run ./webizen-desktop from this directory so the packaged studio-dist and portal sidecars are available.
          EOF
          chmod +x "$out/webizen-desktop"
          ditto -c -k --keepParent "$out" webizen-desktop-macos-aarch64-metal.zip
          installerOut="release-assets/desktop-macos-metal-installer"
          rm -rf "$installerOut"
          mkdir -p "$installerOut"
          found=0
          for root in "target/aarch64-apple-darwin/release/bundle" "crates/webizen-desktop/target/aarch64-apple-darwin/release/bundle"; do
            if [ -d "$root" ]; then
              while IFS= read -r -d '' file; do
                cp "$file" "$installerOut/"
                found=1
              done < <(find "$root" -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.sig' \) -print0)
            fi
          done
          test "$found" -eq 1
          find "$installerOut" -maxdepth 1 -type f -name '*.sig' | grep -q .
          ls -lah "$out" "$installerOut" webizen-desktop-macos-aarch64-metal.zip

      - name: Upload macOS Metal artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-metal-artifacts
          path: |
            webizen-desktop-macos-aarch64-metal.zip
            release-assets/desktop-macos-metal-installer/*

      - name: Upload macOS Metal desktop to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            webizen-desktop-macos-aarch64-metal.zip
            release-assets/desktop-macos-metal-installer/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-desktop-updater-manifest:
    name: Desktop updater manifest
    runs-on: ubuntu-latest
    needs:
      - build-desktop-windows
      - build-desktop-macos-metal
    steps:
      - uses: actions/checkout@v4

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Generate updater manifest
        shell: pwsh
        run: |
          ./scripts/create-webizen-latest-json.ps1 `
            -ArtifactsDir release-assets `
            -Tag "${{ env.RELEASE_TAG }}" `
            -Output webizen-latest.json `
            -Notes "Webizen Desktop ${{ env.RELEASE_TAG }}"

      - name: Upload updater manifest to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: webizen-latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
