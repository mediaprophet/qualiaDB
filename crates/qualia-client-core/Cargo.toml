[package]
name = "qualia-client-core"
version = "0.0.39"
edition = "2021"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ciborium = { workspace = true }
serde_yaml = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true, default-features = false, features = ["rustls", "json", "stream", "blocking"] }
qualia-core-db = { workspace = true, default-features = true, features = ["sanctuary-crypto", "libp2p-compat"] }
vibe = { workspace = true }
qualia-vision = { workspace = true }
qualia-audio = { workspace = true }
qualia-solid-bridge = { workspace = true }
wellfare-core = { workspace = true }
webizen-render = { workspace = true }
qualia-cooperative-core = { workspace = true }
futures-util = { workspace = true }
bip39 = { workspace = true, features = ["rand"] }
rand = { workspace = true }
lazy_static = "1.4"
log = { workspace = true }
base64 = { workspace = true, default-features = true }
hex = { workspace = true }
sha2 = { workspace = true, default-features = false }
hmac = { workspace = true, default-features = false }
byteorder = { workspace = true }
pdf-extract = { workspace = true }
regex = { workspace = true }
image = { workspace = true, default-features = false, features = ["png", "jpeg", "webp", "gif"] }
sha1 = { workspace = true }
url = "2.5"
urlencoding = { workspace = true }
ed25519-dalek = { workspace = true, default-features = true }
rtrb = { workspace = true }
tiny_http = "0.12"
bytemuck = { workspace = true }
lz4_flex = { workspace = true }
chrono = { workspace = true, default-features = true }
uuid = { workspace = true, features = ["v4"] }
k256 = { version = "0.14", features = ["ecdsa"] }
bip32 = { version = "0.5.1", features = ["secp256k1"] }
ripemd = "0.2"
sha3 = { workspace = true }
bs58 = { version = "0.5.1", features = ["check"] }
# Semantic mail client transport (native only; the client acts as a semantic mail client over SMTP/IMAP).
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "pool"] }
imap = "2.4"
native-tls = "0.2"
bech32 = "0.12.0"
scraper = { workspace = true }
x509-parser = { version = "0.16", features = ["verify"] }
rustls-pemfile = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Provider bearer credentials are held by the operating-system keychain, never
# serialized into the agent roster or inference settings files.
keyring = "4"
# Official Nym mixnet client — Wallet/Settings enable → real claim+bind.
nym-sdk = "1.21.6"
nym-network-defaults = "1.22.0"
# DerivationMaterial for KeyVault-held mixnet seed (keyRole ≠ session).
nym-crypto = "1.22.0"

[dev-dependencies]
dhat = { workspace = true }
tempfile = { workspace = true }

