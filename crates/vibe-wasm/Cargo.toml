[package]
name = "vibe-wasm"
version = "0.0.39"
edition = "2021"
description = "WASM bindings for VibeScript — parse, check, evaluate, and compile bytecode in the browser."
license-file = "LICENSE"
repository = "https://github.com/mediaprophet/qualiaDB"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
vibe = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = { workspace = true }
serde_json = { workspace = true }
js-sys = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
