[package]
name = "vibe-wasm"
version = "0.0.33"
edition = "2021"
description = "WASM bindings for VibeScript — parse, check, evaluate, and compile bytecode in the browser."
license-file = "LICENSE"
repository = "https://github.com/mediaprophet/qualiaDB"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
vibe = { path = "../vibe" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
js-sys = "0.3"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
