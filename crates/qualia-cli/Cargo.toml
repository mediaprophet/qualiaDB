[package]
name = "qualia-cli"
version = "0.0.23"
edition = "2021"
build = "build.rs"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
default-run = "qualia-cli"

[[bin]]
name = "q42_comparative_bench"
path = "src/bin/q42_comparative_bench.rs"

[features]
mock-agent = []

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
qualia-core-db = { path = "../qualia-core-db" }
qualia-client-core = { path = "../qualia-client-core" }
qualia-solid-bridge = { path = "../qualia-solid-bridge" }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["std"] }
serde_yaml = "0.9"
reqwest = { version = "0.13", features = ["json", "multipart"] }
git2 = "0.21"
ed25519-dalek = "2.2"
getrandom = "0.4"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
chrono = "0.4.44"
sysinfo = "0.39.3"
futures-util = "0.3.32"
bytemuck = { version = "1.14", features = ["derive"] }
rio_xml = "0.8"
rio_api = "0.8"
lz4_flex = "0.13"
log = "0.4"
env_logger = "0.11"
sha1 = "0.11.0"
sha2 = "0.10"
minicbor = "2.2.2"
memmap2 = "0.9"
csv = "1.3"
atoi = "3.0"
spargebra = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.12"
