[package]
name = "qualia-cli"
version = "0.0.41"
edition = "2021"
build = "build.rs"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
default-run = "qualia-cli"

[[bin]]
name = "q42_comparative_bench"
path = "src/bin/q42_comparative_bench.rs"

[features]
mock-agent = []
webizen-native-host = ["qualia-core-db/webizen-native-host"]
webizen-native-desktop = ["qualia-core-db/webizen-native-desktop"]
webizen-native-subsystem = ["qualia-core-db/webizen-native-subsystem"]
webizen-native-mobile = ["qualia-core-db/webizen-native-mobile"]
webizen-native-iot-headless = ["qualia-core-db/webizen-native-iot-headless"]
webizen-native-iot-display = ["qualia-core-db/webizen-native-iot-display"]

[dependencies]
clap = { workspace = true, features = ["derive"] }
qualia-mcp = { workspace = true }
qualia-client-core = { workspace = true }
qualia-solid-bridge = { workspace = true }
webizen-render = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
serde_yaml = { workspace = true }
reqwest = { workspace = true, default-features = true, features = ["json", "multipart"] }
git2 = "0.21"
ed25519-dalek = { workspace = true, default-features = true }
getrandom = { workspace = true }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
chrono = { workspace = true, default-features = true }
sysinfo = { workspace = true }
futures-util = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
rio_xml = { workspace = true }
rio_api = { workspace = true }
lz4_flex = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
sha1 = { workspace = true }
sha2 = { workspace = true, default-features = true }
hex = { workspace = true }
minicbor = { workspace = true }
memmap2 = "0.9"
csv = { workspace = true }
atoi = { workspace = true }
spargebra = "0.4"

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
qualia-core-db = { workspace = true, default-features = true }

[target.'cfg(not(windows))'.dependencies]
qualia-core-db = { workspace = true, default-features = false, features = ["profile_target_1024", "qdnf", "sanctuary-crypto"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.12"
