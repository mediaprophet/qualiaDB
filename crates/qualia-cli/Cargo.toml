[package]
name = "qualia-cli"
version = "0.0.39"
edition = "2021"
build = "build.rs"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
default-run = "qualia-cli"

[[bin]]
name = "q42_comparative_bench"
path = "src/bin/q42_comparative_bench.rs"

[features]
mock-agent = []

[dependencies]
clap = { workspace = true, features = ["derive"] }
qualia-core-db = { workspace = true, default-features = true }
qualia-client-core = { workspace = true }
qualia-solid-bridge = { workspace = true }
webizen-render = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
serde_yaml = { workspace = true }
reqwest = { workspace = true, default-features = true, features = ["json", "multipart"] }
git2 = "0.21"
ed25519-dalek = { workspace = true, default-features = true }
getrandom = { workspace = true }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
chrono = { workspace = true, default-features = true }
sysinfo = { workspace = true }
futures-util = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
rio_xml = { workspace = true }
rio_api = { workspace = true }
lz4_flex = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
sha1 = { workspace = true }
sha2 = { workspace = true, default-features = true }
minicbor = { workspace = true }
memmap2 = "0.9"
csv = { workspace = true }
atoi = { workspace = true }
spargebra = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.12"
