[package]
name = "qualia-solid-bridge"
version = "0.0.39"
edition = "2021"
description = "W3C Solid personal pod server + consumer agent for Webizen/Qualia"
license = "MIT OR Apache-2.0"

[dependencies]
qualia-core-db = { workspace = true, default-features = true }
tokio = { workspace = true, features = ["full"] }
warp = { workspace = true, features = ["server"] }
bytes = "1.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
core_affinity = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
dhat = { workspace = true }
# warp's in-process test harness (warp::test) for the bridge-route gating tests.
warp = { workspace = true, features = ["test"] }
tokio = { workspace = true, features = ["full", "test-util", "macros"] }

[features]
default = []
# Historical compile-time flag: also forces demo OIDC on. Prefer runtime
# `BridgeConfig.demo_oidc` / QUALIA_SOLID_DEMO_OIDC=1 for local personal pods.
demo = []
dhat-heap = []
