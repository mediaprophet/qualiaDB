[package]
name = "qualia-audio"
version = "0.0.33"
edition = "2021"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
description = "Native auditory intelligence for QualiaDB — AudioView ABI, features, events, language/music scaffolds"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["cpu-reference"]
cpu-reference = []
# Future: shared wgpu + forge audio ops.
gpu = []
# Optional cold-path codecs beyond built-in WAV.
codecs = []
native-capture = ["dep:cpal"]
speech = []
music = []
production = []
generation = []

[dependencies]
# Optional: host mic (desktop). Not for wasm32.
cpal = { version = "0.15", optional = true }

[dev-dependencies]
