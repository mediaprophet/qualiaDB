<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Webizen</title><link rel="stylesheet" href="/volumes.css"></head><body data-volume="admin"><header><h1>Admin <span class="pill live">Live</span></h1><p class="lead">Jobs · schedules · background runner. Ops tool — never a person.</p></header><div class="tabs"><button data-tab="queue">Queue</button><button data-tab="schedules">Schedules</button><button data-tab="runner">Runner</button><button data-tab="logs">Logs</button></div><main class="admin-grid"><section class="panel" data-panel="queue"><h2>Queue</h2><button id="enqueue">Enqueue job</button><button id="drain">Drain failed</button><div id="jobs"></div></section><section class="panel" data-panel="schedules" hidden><h2>Schedules</h2><p>Mail poll · Live</p><p>Library reindex · Planned</p></section><section class="panel" data-panel="runner" hidden><h2>Background runner</h2><p id="runner-status">Runner Live · local simulation</p><button id="run">Run</button><button id="pause">Pause</button><button id="step">Step one</button></section><section class="panel" data-panel="logs" hidden><h2>Logs</h2><pre id="log"></pre></section></main><p class="note"><strong>Volume:</strong> /volumes/admin · Jobs are tools. Humans operate; agents never own the queue.</p><script>(function(){let jobs=[{id:'j-1042',name:'index · Library shelf',state:'running'},{id:'j-1041',name:'mail · fetch adapters',state:'queued'}];const out=document.getElementById('jobs'),log=document.getElementById('log'),status=document.getElementById('runner-status');function paint(){out.innerHTML=jobs.map(j=>'<div class="job"><b>'+j.id+'</b><span>'+j.name+'</span><span class="pill live">'+j.state+'</span></div>').join('')}function write(s){log.textContent+=s+'\n'}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>document.querySelectorAll('[data-panel]').forEach(p=>p.hidden=p.dataset.panel!==b.dataset.tab));document.getElementById('enqueue').onclick=()=>{let id='j-'+Date.now();jobs.unshift({id,name:'manual · operator job',state:'queued'});paint();write('enqueue '+id)};document.getElementById('drain').onclick=()=>{jobs=jobs.filter(j=>j.state!=='failed');paint();write('drain failed')};document.getElementById('run').onclick=()=>{status.textContent='Runner Live · processing queue';write('runner start')};document.getElementById('pause').onclick=()=>{status.textContent='Runner paused · local';write('runner pause')};document.getElementById('step').onclick=()=>{let j=jobs.find(x=>x.state==='queued');if(j){jobs=jobs.filter(x=>x!==j);paint();write('complete '+j.id)}};paint();write('admin volume ready')})()</script></body></html>
