<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Settings · Webizen</title>
<link rel="stylesheet" href="/volumes.css"/>
<style>
/* Elevated volume chrome — monet SoT · tokens aligned to shell.css (tip fbac37a1) */
:root{
  --void:#03060c; --ink:#eaf3fa; --mute:#7f95a8;
  --teal:#2fe0c8; --cyan:#4db8ff; --violet:#8b7cff;
  --live:#3dffb0; --plan:#8a9aab; --focus:#ffd27a;
  --glass:rgba(12,20,32,.62); --line:rgba(255,255,255,.10);
  --panel:rgba(10,16,26,.78); --edge:var(--line);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font:14px/1.45 system-ui,-apple-system,sans-serif;color:var(--ink);
  background:
    radial-gradient(1100px 640px at 14% 8%,#143a4ecc 0%,transparent 52%),
    radial-gradient(900px 560px at 92% 88%,#2a1f66aa 0%,transparent 48%),
    radial-gradient(700px 480px at 48% 110%,#0d3d3a88 0%,transparent 45%),
    linear-gradient(180deg,#040810 0%,#071018 42%,#050c14 100%);
  padding:1.15rem 1.25rem 1.6rem;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;z-index:0;
  background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0);
  background-size:28px 28px;
  mask-image:radial-gradient(ellipse at center,black 22%,transparent 78%);
}
body > *{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:100;padding:10px 14px;background:var(--focus);color:#111;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

.cont-strip{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 .85rem;
  padding:5px 6px;width:fit-content;max-width:100%;
  border-radius:999px;background:rgba(6,10,18,.75);border:1px solid var(--line);
  backdrop-filter:blur(18px);box-shadow:0 12px 40px #0006;font-size:11px;color:var(--mute);
}
.cont-strip button,.cont-strip span.plane{
  appearance:none;border:0;background:transparent;color:var(--mute);font:600 11px system-ui;
  padding:6px 12px;border-radius:999px;cursor:default;
}
.cont-strip button[aria-current="true"],.cont-strip span.plane.on{
  background:rgba(47,224,200,.16);color:var(--teal);
}
.cont-strip .sep{width:1px;height:14px;background:var(--line);margin:0 2px}
.cont-strip .hint{padding:0 8px 0 4px;font-size:10px;color:var(--mute)}

header.vol-head{margin:0 0 1rem}
header.vol-head h1{
  font-size:1.2rem;margin:0 0 .35rem;font-weight:650;letter-spacing:-.01em;
  display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;
}
header.vol-head .lead{color:var(--mute);max-width:68ch;margin:0;font-size:13px;line-height:1.5}
.glyph{font-size:1.05em;line-height:1}

.pill{display:inline-block;font-size:10px;text-transform:uppercase;padding:2px 7px;border-radius:999px;font-weight:650;letter-spacing:.03em}
.pill.live{color:#052e1c;background:var(--live)}
.pill.planned{color:#0f172a;background:var(--plan)}

.stage{display:grid;grid-template-columns:1fr;gap:1rem;max-width:1080px}
@media(min-width:880px){.stage.two{grid-template-columns:1.15fr .85fr}}
@media(min-width:960px){.stage.mail{grid-template-columns:minmax(240px,.9fr) 1.2fr}}
@media(min-width:900px){.stage.dir{grid-template-columns:1.2fr .85fr}}
@media(min-width:900px){.stage.lib{grid-template-columns:1.1fr .9fr}}
@media(min-width:900px){.stage.talk{grid-template-columns:minmax(220px,.85fr) 1.25fr}}
@media(min-width:900px){.stage.admin{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.stage.wallet{grid-template-columns:1.15fr .85fr}}
@media(min-width:900px){.stage.settings{grid-template-columns:1.1fr .9fr}}

.panel,.vol{
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.1);
  border:1px solid var(--line);border-radius:18px;
  box-shadow:0 28px 70px #000a,inset 0 1px 0 rgba(255,255,255,.06);
  overflow:hidden;min-width:0;
}
.panel:focus-within,.vol:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.ph,.vh{
  display:flex;align-items:center;gap:.55rem;padding:.6rem .9rem;
  background:linear-gradient(180deg,rgba(255,255,255,.05),transparent);
  border-bottom:1px solid var(--line);font-size:12px;user-select:none;
}
.ph b,.vh b{flex:1;font-size:13px;font-weight:650}
.ph .mark,.vh .mark{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);flex-shrink:0}
.pb,.vb{padding:1rem 1.05rem 1.15rem}

.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.75rem 0}
.row:first-child{margin-top:0}
.stack{display:flex;flex-direction:column;gap:.55rem}
label.lbl{display:block;font-size:11px;color:var(--mute);font-weight:650;margin:0 0 .3rem;letter-spacing:.02em}
input,textarea,select{
  width:100%;padding:.65rem .8rem;border-radius:12px;border:1px solid var(--line);
  background:rgba(0,0,0,.35);color:var(--ink);font:inherit;
}
textarea{resize:vertical;min-height:5.5rem}
input::placeholder,textarea::placeholder{color:rgba(127,149,168,.75)}
button{
  appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.06);
  color:var(--ink);padding:.55rem .9rem;border-radius:12px;font:650 12px system-ui;cursor:pointer;
  transition:background .15s,border-color .15s,box-shadow .15s;
}
button.primary{background:rgba(47,224,200,.18);border-color:rgba(47,224,200,.42);color:#b8fff4}
button.primary:hover{background:rgba(47,224,200,.28);box-shadow:0 0 18px rgba(47,224,200,.2)}
button.ghost{background:transparent}
button:hover{border-color:rgba(47,224,200,.35)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{
  outline:2px solid var(--focus);outline-offset:2px;
}
button:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
button.chip{
  border-radius:999px;padding:.35rem .75rem;font-size:11px;
  background:rgba(8,14,22,.55);
}
button.chip[aria-pressed="true"]{background:rgba(47,224,200,.16);border-color:rgba(47,224,200,.45);color:var(--teal)}

.list{margin:0;padding:0;list-style:none}
.list > li{
  padding:.7rem .8rem;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;
  display:grid;gap:.2rem;
}
.list > li:last-child{border-bottom:0}
.list > li.interactive{cursor:pointer;border-radius:10px;border:1px solid transparent;margin:0 0 4px;border-bottom-color:transparent}
.list > li.interactive:hover,.list > li.interactive[aria-selected="true"]{
  background:rgba(47,224,200,.1);border-color:rgba(47,224,200,.35);
}
.list > li .meta{font-size:11px;color:var(--mute)}
.list > li .title{font-weight:650;color:var(--ink)}
.muted{color:var(--mute);font-size:12px}
.empty{
  padding:1.35rem 1rem;text-align:center;border-radius:14px;
  border:1px dashed rgba(77,184,255,.28);background:rgba(8,14,22,.35);
  color:var(--mute);font-size:13px;
}
.empty strong{display:block;color:var(--cyan);font-size:13px;margin-bottom:.4rem}
.empty p{margin:.35rem 0 0;max-width:36ch;margin-inline:auto}

.note{
  margin-top:1rem;padding:.8rem .9rem;border-radius:12px;border:1px solid var(--line);
  background:rgba(0,0,0,.28);font-size:12px;color:var(--mute);line-height:1.45;
}
.note strong{color:var(--cyan)}
code{color:var(--cyan);font-size:12px}
#status,.status{font-size:11px;color:var(--mute);margin:.75rem 0 0;min-height:1.2em}

.rise{animation:softRise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes softRise{
  from{opacity:0;transform:translateY(10px) scale(.985)}
  to{opacity:1;transform:none}
}
@media (prefers-reduced-motion:reduce){.rise{animation:none}}

.person-row{
  display:grid;grid-template-columns:40px 1fr auto;gap:.75rem;align-items:center;
  padding:.65rem .7rem;border-radius:14px;border:1px solid transparent;cursor:pointer;
  text-align:left;width:100%;background:transparent;color:inherit;font:inherit;
}
.person-row:hover,.person-row[aria-selected="true"]{
  background:rgba(47,224,200,.1);border-color:rgba(47,224,200,.35);
}
.person-row .orb{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:15px;
  background:radial-gradient(circle at 35% 30%,#3a5570,#1a2838);
  box-shadow:0 0 16px rgba(47,224,200,.28),0 8px 20px #0006;
}
.person-row.tool .orb{box-shadow:0 8px 20px #0006;opacity:.9}
.person-row .name{font-weight:650;font-size:13px;display:block}
.person-row .sub{font-size:11px;color:var(--mute);display:block}
.person-row.tool .name{color:var(--mute)}

.mail-toolbar{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 .75rem}
.message-body{
  min-height:8rem;padding:.85rem;border-radius:12px;border:1px solid var(--line);
  background:rgba(0,0,0,.22);font-size:13px;line-height:1.55;white-space:pre-wrap;
}
.compose-sheet{display:none}.compose-sheet.open{display:block}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.75rem}
.card{
  appearance:none;border:1px solid var(--line);border-radius:14px;padding:.85rem;
  background:rgba(8,14,22,.55);color:inherit;font:inherit;text-align:left;cursor:pointer;
  transition:border-color .15s,box-shadow .15s,transform .15s;
  box-shadow:0 12px 32px #0005;
}
.card:hover,.card:focus-visible{
  border-color:rgba(47,224,200,.45);box-shadow:0 16px 40px #0008,0 0 20px rgba(47,224,200,.15);
  outline:none;
}
.card .mark{width:8px;height:8px;border-radius:50%;background:var(--cyan);display:inline-block;margin-right:.4rem;box-shadow:0 0 8px var(--cyan)}
.card h3{margin:0 0 .35rem;font-size:13px;font-weight:650}
.card p{margin:0;font-size:11px;color:var(--mute);line-height:1.4}
.reader{
  display:none;padding:1rem;border-radius:14px;border:1px solid var(--line);
  background:rgba(6,12,20,.7);min-height:12rem;
}
.reader.open{display:block}
.reader h2{margin:0 0 .5rem;font-size:1rem}
.reader .body{color:var(--mute);font-size:13px;line-height:1.55}

.toggle{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.7rem 0;border-bottom:1px solid rgba(255,255,255,.06);
}
.toggle:last-child{border-bottom:0}
.toggle .t-label{font-size:13px;font-weight:650}
.toggle .t-hint{font-size:11px;color:var(--mute);margin-top:.15rem}
.switch{
  position:relative;width:42px;height:24px;border-radius:999px;border:1px solid var(--line);
  background:rgba(0,0,0,.4);cursor:pointer;flex-shrink:0;padding:0;
}
.switch[aria-checked="true"]{background:rgba(47,224,200,.35);border-color:rgba(47,224,200,.55)}
.switch span{
  position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:var(--ink);transition:transform .15s;
}
.switch[aria-checked="true"] span{transform:translateX(18px)}
@media (prefers-reduced-motion:reduce){.switch span{transition:none}}

.chains{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1rem}
.chain{
  padding:.55rem .75rem;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);font-size:12px;min-width:5.5rem;
}
.chain.on{border-color:rgba(47,224,200,.4);background:rgba(47,224,200,.1)}
.chain .tag{display:block;font-size:10px;color:var(--mute);margin-top:2px}
.bal{font-size:1.75rem;font-weight:650;letter-spacing:-.02em;margin:0 0 .25rem}
table.assets{width:100%;border-collapse:collapse;font-size:12px}
table.assets th,table.assets td{
  text-align:left;padding:.5rem .4rem;border-bottom:1px solid rgba(255,255,255,.06);color:var(--mute);
}
table.assets th{color:var(--ink);font-weight:650}
table.assets td.amt{color:var(--ink);font-variant-numeric:tabular-nums}

.grid-tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.65rem}
.tool-tile{
  padding:.85rem;border-radius:14px;border:1px solid var(--line);
  background:rgba(8,14,22,.5);font-size:12px;
}
.tool-tile h3{margin:0 0 .3rem;font-size:13px;font-weight:650}
.tool-tile p{margin:0;color:var(--mute);font-size:11px}
.log-pane{
  font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;
  padding:.75rem;max-height:220px;overflow:auto;color:var(--mute);white-space:pre-wrap;
}
.url-bar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.url-bar input{flex:1;min-width:12rem}
.viewport{
  margin-top:.85rem;min-height:14rem;border-radius:14px;border:1px dashed rgba(77,184,255,.28);
  background:rgba(8,14,22,.4);display:grid;place-content:center;text-align:center;
  padding:1.25rem;color:var(--mute);font-size:13px;
}
.viewport strong{display:block;color:var(--cyan);margin-bottom:.4rem}

.thread{display:flex;flex-direction:column;gap:.55rem;min-height:10rem;max-height:42vh;overflow:auto;padding:.25rem}
.bubble{
  max-width:85%;padding:.65rem .8rem;border-radius:14px;font-size:13px;line-height:1.45;
  border:1px solid var(--line);background:rgba(0,0,0,.28);
}
.bubble.me{align-self:flex-end;background:rgba(47,224,200,.12);border-color:rgba(47,224,200,.3)}
.bubble .who{font-size:10px;color:var(--mute);font-weight:650;margin-bottom:.2rem;text-transform:uppercase;letter-spacing:.04em}

.planned-banner{
  padding:1.25rem 1.1rem;border-radius:16px;border:1px dashed rgba(138,154,171,.55);
  background:rgba(8,14,22,.45);text-align:center;
}
.planned-banner h2{margin:0 0 .5rem;font-size:1.05rem;color:var(--ink)}
.planned-banner p{margin:0 auto;max-width:48ch;color:var(--mute);font-size:13px;line-height:1.5}

.file-row{
  display:grid;grid-template-columns:28px 1fr auto;gap:.65rem;align-items:center;
  padding:.55rem .65rem;border-radius:12px;border:1px solid transparent;cursor:pointer;
  width:100%;background:transparent;color:inherit;font:inherit;text-align:left;
}
.file-row:hover,.file-row[aria-selected="true"]{background:rgba(47,224,200,.1);border-color:rgba(47,224,200,.35)}

/* —— elevated extras: instruments / settings / admin / poet / wallet —— */
.stage.inst{display:grid;gap:1rem;max-width:1080px}
@media(min-width:900px){.stage.inst{grid-template-columns:1.1fr .9fr}}
.stage.set{display:grid;gap:1rem;max-width:1080px}
@media(min-width:900px){.stage.set{grid-template-columns:1.1fr .9fr}}
.stage.admin{display:grid;gap:1rem;max-width:1100px}
@media(min-width:900px){.stage.admin{grid-template-columns:1fr 1fr}}
.stage.wallet{display:grid;gap:1rem;max-width:1100px}
@media(min-width:900px){.stage.wallet{grid-template-columns:1.15fr .85fr}}
.msg-body{
  min-height:8rem;padding:.85rem;border-radius:12px;border:1px solid var(--line);
  background:rgba(0,0,0,.22);font-size:13px;line-height:1.55;white-space:pre-wrap;
}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.65rem}
.tool-tile{
  padding:.85rem;border-radius:14px;border:1px solid var(--line);
  background:rgba(8,14,22,.5);font-size:12px;text-align:left;color:inherit;font:inherit;cursor:pointer;
  transition:border-color .15s,box-shadow .15s;
}
.tool-tile:hover,.tool-tile:focus-visible,.tool-tile[aria-pressed="true"]{
  border-color:rgba(47,224,200,.45);box-shadow:0 0 18px rgba(47,224,200,.15);outline:none;
}
.tool-tile h3{margin:0 0 .3rem;font-size:13px;font-weight:650}
.tool-tile p{margin:0;color:var(--mute);font-size:11px}
.rail-row{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1rem}
.rail{
  padding:.55rem .75rem;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);font-size:12px;min-width:5.5rem;
}
.rail.on{border-color:rgba(47,224,200,.4);background:rgba(47,224,200,.1)}
.rail .tag{display:block;font-size:10px;color:var(--mute);margin-top:2px}
.bal{font-size:1.75rem;font-weight:650;letter-spacing:-.02em;margin:0 0 .25rem}
table.assets{width:100%;border-collapse:collapse;font-size:12px}
table.assets th,table.assets td{
  text-align:left;padding:.5rem .4rem;border-bottom:1px solid rgba(255,255,255,.06);color:var(--mute);
}
table.assets th{color:var(--ink);font-weight:650}
table.assets td.amt{color:var(--ink);font-variant-numeric:tabular-nums}
.job{
  display:grid;grid-template-columns:1fr auto;gap:.35rem .75rem;align-items:center;
  padding:.65rem .7rem;border-radius:12px;border:1px solid rgba(255,255,255,.06);
  margin-bottom:.4rem;background:rgba(0,0,0,.2);
}
.job .j-name{font-weight:650;font-size:13px}
.job .j-meta{font-size:11px;color:var(--mute)}
.log-pane{
  font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;
  padding:.75rem;max-height:240px;overflow:auto;color:var(--mute);white-space:pre-wrap;
}
.toggle{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.7rem 0;border-bottom:1px solid rgba(255,255,255,.06);
}
.toggle:last-child{border-bottom:0}
.toggle .t-label{font-size:13px;font-weight:650}
.toggle .t-hint{font-size:11px;color:var(--mute);margin-top:.15rem}
.switch{
  position:relative;width:42px;height:24px;border-radius:999px;border:1px solid var(--line);
  background:rgba(0,0,0,.4);cursor:pointer;flex-shrink:0;padding:0;
}
.switch[aria-checked="true"]{background:rgba(47,224,200,.35);border-color:rgba(47,224,200,.55)}

  position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:var(--ink);transition:transform .15s;display:block;
}

  background:rgba(8,14,22,.45);text-align:center;
}
.planned-banner h2{margin:0 0 .5rem;font-size:1.05rem;color:var(--ink)}
.planned-banner p{margin:0 auto;max-width:48ch;color:var(--mute);font-size:13px;line-height:1.5}
.cont-list{margin:0;padding:0;list-style:none}
.cont-list li{padding:.55rem 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.cont-list li:last-child{border-bottom:0}
.cont-list strong{color:var(--teal)}


/* —— Admin · Console · Wallet —— monet wave-3 */
.admin-grid{display:grid;gap:1rem;max-width:1200px}
@media(min-width:960px){.admin-grid{grid-template-columns:1.1fr .9fr}}
.log{font:12px/1.45 ui-monospace,menlo,monospace;max-height:220px;overflow:auto;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:.65rem .75rem}
.log .line{padding:.2rem 0;border-bottom:1px solid rgba(255,255,255,.04);color:var(--mute)}
.log .line.ok{color:var(--live)}.log .line.err{color:#f87171}.log .line.run{color:var(--cyan)}
.job{display:flex;align-items:center;gap:.65rem;padding:.65rem .75rem;border-bottom:1px solid var(--line)}
.job:last-child{border-bottom:0}
.job .id{font:650 12px ui-monospace,monospace;color:var(--cyan)}
.job .meta{flex:1;font-size:12px;color:var(--mute)}
.console-grid{display:grid;gap:1rem;max-width:1100px}
@media(min-width:880px){.console-grid{grid-template-columns:.9fr 1.2fr}}
.cmd{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.55rem .7rem;border-bottom:1px solid var(--line);font-size:13px}
.cmd code{color:var(--teal)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:13px}
.toggle:last-child{border-bottom:0}
.toggle input{accent-color:var(--teal)}
.rails{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1rem}
.rail{padding:.55rem .75rem;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px;cursor:pointer}
.rail[aria-pressed="true"]{border-color:rgba(47,224,200,.45);background:rgba(47,224,200,.12)}
.rail .tag{display:block;font-size:10px;color:var(--mute);margin-top:2px}
.bal{font-size:1.75rem;font-weight:650;letter-spacing:-.02em;margin:0 0 .25rem}
.planned-hero{padding:1.5rem 1.25rem;border-radius:16px;border:1px dashed rgba(138,154,171,.45);background:rgba(8,14,22,.5);text-align:center;max-width:560px}
.planned-hero h2{margin:0 0 .5rem;font-size:1.15rem}
.tabs{display:flex;gap:.35rem;flex-wrap:wrap;margin:0 0 .75rem}
.tabs button{font-size:11px}
.tabs button[aria-selected="true"]{background:rgba(47,224,200,.18);border-color:rgba(47,224,200,.45);color:#b8fff4}


/* Projects — collaborative Workstream A */
.proj-grid{display:grid;gap:1rem;max-width:1200px}
@media(min-width:960px){.proj-grid{grid-template-columns:1fr 1.25fr}}
.proj-card{display:block;width:100%;text-align:left;padding:.85rem .9rem;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;font:inherit;cursor:pointer}
.proj-card:hover,.proj-card[aria-selected="true"]{background:rgba(47,224,200,.12)}
.proj-card .title{font-weight:650;font-size:14px}
.proj-card .sub{display:block;font-size:11px;color:var(--mute);margin-top:.2rem}
.containers{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.55rem}
.containers button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:14px;padding:.75rem .65rem;font:650 12px system-ui;cursor:pointer;text-align:left;min-height:4.5rem}
.containers button:hover,.containers button[aria-pressed="true"]{border-color:rgba(47,224,200,.45);background:rgba(47,224,200,.12)}
.containers button .c-name{display:block;margin-bottom:.25rem}
.containers button .c-status{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:.65rem;min-height:200px}
.kanban .col{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:.55rem;min-height:180px}
.kanban .col h3{margin:0 0 .5rem;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.kanban .card{background:rgba(12,20,32,.8);border:1px solid var(--line);border-radius:10px;padding:.55rem .65rem;margin-bottom:.45rem;font-size:12px}
.kanban .card .who{font-size:10px;color:var(--mute)}


/* WellFair — welfare · fairness */
.wf-grid{display:grid;gap:1rem;max-width:1180px}
@media(min-width:900px){.wf-grid{grid-template-columns:1fr 1.15fr}}
.wf-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.55rem}
.wf-tiles button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.04);color:inherit;border-radius:14px;padding:.85rem .7rem;font:650 12px system-ui;cursor:pointer;text-align:left;min-height:5rem}
.wf-tiles button:hover,.wf-tiles button[aria-pressed="true"]{border-color:rgba(47,224,200,.45);background:rgba(47,224,200,.12)}
.wf-tiles .t{display:block;margin-bottom:.3rem;font-size:13px}
.wf-tiles .s{display:block;font-size:10px;color:var(--mute);font-weight:500;line-height:1.35}
.wf-need{padding:.65rem .75rem;border-bottom:1px solid var(--line);display:flex;gap:.65rem;align-items:flex-start}
.wf-need .u{font-size:10px;text-transform:uppercase;letter-spacing:.05em}

/* Settings IA — prefs/setup/config home */
.set-layout{display:grid;gap:1rem;max-width:1100px}
@media(min-width:880px){.set-layout{grid-template-columns:12rem 1fr}}
.set-nav{display:flex;flex-direction:column;gap:.25rem}
.set-nav button{appearance:none;border:1px solid transparent;background:transparent;color:var(--mute);text-align:left;padding:.55rem .7rem;border-radius:12px;font:650 12px system-ui;cursor:pointer}
.set-nav button[aria-current="true"]{background:rgba(47,224,200,.14);border-color:rgba(47,224,200,.35);color:var(--teal)}
.set-nav .group{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);padding:.75rem .7rem .25rem}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.t-label{font-weight:650;font-size:13px}
.t-hint{font-size:11px;color:var(--mute)}
.switch{width:42px;height:24px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.08);position:relative;cursor:pointer;padding:0}
.switch span{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#eaf3fa;transition:left .15s}
.switch[aria-checked="true"]{background:rgba(47,224,200,.35);border-color:rgba(47,224,200,.5)}
.switch[aria-checked="true"] span{left:20px}
.switch:disabled{opacity:.4;cursor:not-allowed}

</style>
</head>
<body data-volume="settings">
<header>
  <h1>Settings <span class="pill live">Live</span></h1>
  <p class="lead">Setup · preferences · configuration — not apps. Local paints Live; host-bound Planned.</p>
  <div class="continuity" aria-label="Continuity">
    <span><b>who</b> · you</span>
    <span><b>claim</b> · prefs / binds</span>
    <span><b>handle</b> · device id ≠ who</span>
    <span><b>tool</b> · agents configured here, never peers</span>
  </div>
</header>
<div class="set-layout">
  <nav class="set-nav panel" aria-label="Settings sections" style="padding:.5rem">
    <div class="group">Preferences</div>
    <button type="button" data-pane="appearance" aria-current="true">Appearance</button>
    <button type="button" data-pane="continuity">Continuity</button>
    <button type="button" data-pane="notifications">Notifications</button>
    <div class="group">Setup</div>
    <button type="button" data-pane="setup">First-run · host</button>
    <button type="button" data-pane="wallet-setup">Wallet rails</button>
    <div class="group">Configuration</div>
    <button type="button" data-pane="agent">Agent · Console prefs</button>
    <button type="button" data-pane="instruments">Instruments binds</button>
    <button type="button" data-pane="advanced">Advanced</button>
  </nav>
  <section class="panel" aria-label="Settings pane">
    <div class="ph"><b id="pane-title">Appearance</b><span class="pill live" id="pane-pill">Live</span></div>
    <div class="pb" id="pane"></div>
  </section>
</div>
<p id="status" role="status" aria-live="polite" class="muted" style="max-width:1100px"></p>
<script>
(function(){
  const panes={
    appearance:{title:"Appearance",pill:"local Live",html:
      '<div class="toggle"><div><div class="t-label">Soft-rise volumes</div><div class="t-hint">Depth when opening volumes</div></div><button type="button" class="switch" data-k="rise" role="switch" aria-checked="true"><span></span></button></div>'+
      '<div class="toggle"><div><div class="t-label">Reduce motion</div><div class="t-hint">Flattens depth · respects OS</div></div><button type="button" class="switch" data-k="motion" role="switch" aria-checked="false"><span></span></button></div>'+
      '<div class="toggle"><div><div class="t-label">Glass density</div><div class="t-hint">Panel blur · local paint</div></div><button type="button" class="switch" data-k="glass" role="switch" aria-checked="true"><span></span></button></div>'+
      '<div class="note"><strong>Not an app</strong> — appearance prefs live here, not on the constellation ring.</div>'},
    continuity:{title:"Continuity",pill:"lock",html:
      '<ul class="list"><li><span class="who">who</span><span class="meta">natural human</span></li><li><span class="who">claim</span><span class="meta">locators / accounts</span></li><li><span class="who">handle</span><span class="meta">≠ person</span></li><li><span class="who">tool</span><span class="meta">Instruments / agents</span></li></ul>'+
      '<div class="toggle"><div><div class="t-label">Show Continuity strip in volumes</div><div class="t-hint">who · claim · handle · tool</div></div><button type="button" class="switch" data-k="cont" role="switch" aria-checked="true"><span></span></button></div>'},
    notifications:{title:"Notifications",pill:"host Planned",html:
      '<div class="toggle"><div><div class="t-label">Talk alerts</div><div class="t-hint">Local mute Live · push Planned</div></div><button type="button" class="switch" data-k="talk" role="switch" aria-checked="true"><span></span></button></div>'+
      '<div class="toggle"><div><div class="t-label">Mail alerts</div><div class="t-hint">Local mute Live · delivery Planned</div></div><button type="button" class="switch" data-k="mail" role="switch" aria-checked="true"><span></span></button></div>'+
      '<div class="toggle"><div><div class="t-label">Host push channel</div><div class="t-hint">Desktop host bind Planned</div></div><button type="button" class="switch" data-k="push" role="switch" aria-checked="false" disabled title="Planned"><span></span></button></div>'},
    setup:{title:"First-run · host",pill:"Setup",html:
      '<p class="muted" style="margin-top:0">Cold-load setup — who present without state handles. Host bind Planned until Desktop claims.</p>'+
      '<div class="toggle"><div><div class="t-label">Complete first-run checklist</div><div class="t-hint">Local progress Live</div></div><button type="button" class="switch" data-k="firstrun" role="switch" aria-checked="false"><span></span></button></div>'+
      '<div class="toggle"><div><div class="t-label">Native host :4242</div><div class="t-hint">Planned until Neo host claim</div></div><button type="button" class="switch" data-k="host" role="switch" aria-checked="false" disabled title="Planned"><span></span></button></div>'+
      '<div class="note"><strong>Setup ≠ app.</strong> Removed from constellation; lives under Settings.</div>'},
    "wallet-setup":{title:"Wallet rails",pill:"Setup",html:
      '<p class="muted" style="margin-top:0">Configure which rails appear — Lightning · Nym · XEC · tokens. No ETH. Signing stays human.</p>'+
      '<div class="toggle"><div><div class="t-label">Lightning</div><div class="t-hint">Show rail in Wallet</div></div><button type="button" class="switch" data-k="ln" role="switch" aria-checked="true"><span></span></button></div>'+
      '<div class="toggle"><div><div class="t-label">Nym</div><div class="t-hint">Privacy rail · Planned bind</div></div><button type="button" class="switch" data-k="nym" role="switch" aria-checked="false"><span></span></button></div>'+
      '<div class="toggle"><div><div class="t-label">eCash XEC</div></div><button type="button" class="switch" data-k="xec" role="switch" aria-checked="true"><span></span></button></div>'+
      '<div class="row"><button type="button" class="primary" id="open-wallet">Open Wallet volume</button></div>'},
    agent:{title:"Agent · Console prefs",pill:"Config",html:
      '<p class="muted" style="margin-top:0">Former Console volume prefs — agents are <strong>tools</strong>, configured here. Never a peer on Talk.</p>'+
      '<div class="toggle"><div><div class="t-label">Allow tool suggestions in volumes</div></div><button type="button" class="switch" data-k="suggest" role="switch" aria-checked="true"><span></span></button></div>'+
      '<div class="toggle"><div><div class="t-label">Auto-run low-risk jobs</div><div class="t-hint">Still goes through Admin runner</div></div><button type="button" class="switch" data-k="autorun" role="switch" aria-checked="false"><span></span></button></div>'+
      '<div class="toggle"><div><div class="t-label">Show spend / limits</div></div><button type="button" class="switch" data-k="spend" role="switch" aria-checked="true"><span></span></button></div>'+
      '<label class="muted" for="model">Preferred instrument</label><select id="model" disabled title="Planned until Instruments bind"><option>Local model (Planned)</option><option>Allowlisted remote (Planned)</option></select>'+
      '<div class="note"><strong>Console demoted</strong> from app ring → Settings · Configuration. Deep link <code>/volumes/settings?pane=agent</code>.</div>'},
    instruments:{title:"Instruments binds",pill:"Config · Planned",html:
      '<p class="muted" style="margin-top:0">Model / LLM / tool allowlists — configuration, not a people surface.</p>'+
      '<div class="toggle"><div><div class="t-label">Local model bind</div></div><button type="button" class="switch" data-k="localm" role="switch" aria-checked="false" disabled title="Planned"><span></span></button></div>'+
      '<div class="toggle"><div><div class="t-label">Allowlisted tools only</div></div><button type="button" class="switch" data-k="allow" role="switch" aria-checked="true"><span></span></button></div>'+
      '<div class="row"><button type="button" id="open-instr">Open Instruments volume</button></div>'},
    advanced:{title:"Advanced",pill:"Config",html:
      '<div class="toggle"><div><div class="t-label">Legacy Studio shell</div><div class="t-hint">WEBIZEN_LEGACY_SHELL only — not product default</div></div><button type="button" class="switch" data-k="legacy" role="switch" aria-checked="false"><span></span></button></div>'+
      '<div class="toggle"><div><div class="t-label">Verbose volume logs</div></div><button type="button" class="switch" data-k="logs" role="switch" aria-checked="false"><span></span></button></div>'+
      '<div class="note">Admin (jobs / scheduler) stays a separate <strong>ops</strong> volume — not Settings.</div>'}
  };
  const paneEl=document.getElementById("pane");
  const title=document.getElementById("pane-title");
  const pill=document.getElementById("pane-pill");
  const status=document.getElementById("status");
  const store=JSON.parse(localStorage.getItem("webizen.settings.v1")||"{}");

  function bindSwitches(){
    paneEl.querySelectorAll(".switch").forEach(btn=>{
      const k=btn.getAttribute("data-k");
      if(k && store[k]!=null) btn.setAttribute("aria-checked", store[k]?"true":"false");
      btn.addEventListener("click",()=>{
        if(btn.disabled) return;
        const on=btn.getAttribute("aria-checked")!=="true";
        btn.setAttribute("aria-checked", on?"true":"false");
        if(k){ store[k]=on; localStorage.setItem("webizen.settings.v1", JSON.stringify(store)); }
        status.textContent=(on?"On":"Off")+" · "+(k||"pref")+" · saved locally";
      });
    });
    const ow=document.getElementById("open-wallet");
    if(ow) ow.onclick=()=>{ try{parent.postMessage({type:"webizen-open",route:"/wallet"},"*");}catch(e){} };
    const oi=document.getElementById("open-instr");
    if(oi) oi.onclick=()=>{ try{parent.postMessage({type:"webizen-open",route:"/volumes/instruments"},"*");}catch(e){} };
  }
  function show(id){
    const p=panes[id]||panes.appearance;
    title.textContent=p.title;
    pill.textContent=p.pill;
    pill.className="pill "+(p.pill.toLowerCase().includes("planned")?"planned":"live");
    paneEl.innerHTML=p.html;
    document.querySelectorAll(".set-nav button[data-pane]").forEach(b=>{
      b.setAttribute("aria-current", b.getAttribute("data-pane")===id?"true":"false");
    });
    bindSwitches();
    status.textContent="Settings · "+p.title+" · not an app";
    try{ history.replaceState(null,"","?pane="+id); }catch(e){}
  }
  document.querySelectorAll(".set-nav button[data-pane]").forEach(b=>{
    b.addEventListener("click",()=>show(b.getAttribute("data-pane")));
  });
  let start="appearance";
  try{ const q=new URLSearchParams(location.search).get("pane"); if(q&&panes[q]) start=q; }catch(e){}
  show(start);
})();
</script>
</body>
</html>
