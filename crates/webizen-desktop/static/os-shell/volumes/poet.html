<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poet HyperCanvas · Webizen NOS</title>
  <link rel="stylesheet" href="/volumes.css">
  <style>
    :root {
      --bg-base: #06080e;
      --bg-surface: rgba(14, 20, 32, 0.75);
      --bg-surface-elevated: rgba(22, 32, 52, 0.85);
      --border-subtle: rgba(100, 160, 240, 0.15);
      --border-glow: rgba(0, 240, 255, 0.35);
      --accent-cyan: #00f0ff;
      --accent-purple: #9d4edd;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg-base); color: var(--text-main);
      font-family: var(--font-sans); font-size: 13px;
      user-select: none;
    }

    /* Top Navigation & Status Bar */
    #poet-topbar {
      height: 48px;
      background: rgba(8, 12, 20, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; gap: 12px; z-index: 100;
      position: relative;
    }

    .brand-group {
      display: flex; align-items: center; gap: 10px;
    }
    .brand-glyph {
      font-size: 18px; filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.5));
    }
    .brand-title {
      font-size: 15px; font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent-cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .pill {
      font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .pill-live {
      background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .pill-daemon {
      background: rgba(0, 240, 255, 0.12); color: var(--accent-cyan);
      border: 1px solid rgba(0, 240, 255, 0.25);
    }

    /* Pager Tabs */
    .pager-tabs {
      display: flex; align-items: center; gap: 4px;
      background: rgba(0, 0, 0, 0.35); padding: 3px; border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .pager-tab {
      padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 500;
      background: transparent; color: var(--text-muted); border: 0; cursor: pointer;
      transition: all 0.15s ease;
    }
    .pager-tab:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.05); }
    .pager-tab.active {
      color: #fff; background: rgba(0, 240, 255, 0.18);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.25);
    }

    /* 4D Temporal Scrubber */
    .scrubber-group {
      display: flex; align-items: center; gap: 8px;
      background: rgba(0, 0, 0, 0.3); padding: 3px 10px; border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .btn-scrub {
      background: transparent; border: 0; color: var(--accent-cyan);
      cursor: pointer; font-size: 12px; display: flex; align-items: center;
    }
    .scrub-slider {
      width: 100px; -webkit-appearance: none; height: 4px;
      border-radius: 2px; background: rgba(255, 255, 255, 0.15);
      outline: none;
    }
    .scrub-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
      background: var(--accent-cyan); cursor: pointer; box-shadow: 0 0 6px var(--accent-cyan);
    }
    .tick-badge {
      font-family: var(--font-mono); font-size: 10px; color: var(--accent-cyan);
      min-width: 55px;
    }

    /* Action Buttons */
    .topbar-actions {
      display: flex; align-items: center; gap: 8px;
    }
    .top-btn {
      padding: 5px 11px; border-radius: 6px; font-size: 11px; font-weight: 500;
      border: 1px solid var(--border-subtle); background: rgba(255, 255, 255, 0.04);
      color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 5px;
      transition: all 0.15s ease;
    }
    .top-btn:hover {
      background: rgba(0, 240, 255, 0.12); border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }
    .top-btn.primary {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.25), rgba(157, 78, 221, 0.25));
      border-color: rgba(0, 240, 255, 0.4);
    }

    /* Main Workspace Layout */
    #poet-workspace {
      position: absolute; top: 48px; left: 0; right: 0; bottom: 0;
      display: flex; overflow: hidden;
    }

    /* 4-Way Tool-Chest */
    #tool-chest {
      position: absolute; z-index: 50;
      background: rgba(10, 15, 25, 0.88);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; flex-direction: column;
    }
    #tool-chest.dock-left {
      top: 12px; left: 12px; bottom: 12px; width: 62px;
      border-radius: 12px;
    }
    #tool-chest.dock-left.expanded { width: 260px; }
    #tool-chest.dock-right {
      top: 12px; right: 12px; bottom: 12px; width: 62px;
      border-radius: 12px;
    }
    #tool-chest.dock-right.expanded { width: 260px; }
    #tool-chest.dock-top {
      top: 12px; left: 80px; right: 80px; height: 56px;
      border-radius: 12px; flex-direction: row;
    }
    #tool-chest.dock-bottom {
      bottom: 12px; left: 80px; right: 80px; height: 56px;
      border-radius: 12px; flex-direction: row;
    }

    .chest-header {
      padding: 10px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
    }
    .chest-dock-ctrls {
      display: flex; gap: 3px;
    }
    .dock-btn {
      width: 20px; height: 20px; border-radius: 4px; border: 0;
      background: rgba(255, 255, 255, 0.05); color: var(--text-dim);
      font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .dock-btn:hover { color: var(--text-main); background: rgba(0, 240, 255, 0.2); }

    .chest-tools {
      flex: 1; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 4px;
    }
    #tool-chest.dock-top .chest-tools, #tool-chest.dock-bottom .chest-tools {
      flex-direction: row; overflow-x: auto; overflow-y: hidden;
    }

    .tool-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border-radius: 8px; border: 1px solid transparent; background: transparent;
      color: var(--text-muted); cursor: pointer; text-align: left; width: 100%;
      transition: all 0.15s ease;
    }
    .tool-item:hover {
      background: rgba(0, 240, 255, 0.08); border-color: rgba(0, 240, 255, 0.2);
      color: var(--text-main);
    }
    .tool-item.active {
      background: rgba(0, 240, 255, 0.15); border-color: var(--accent-cyan);
      color: var(--accent-cyan); box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
    }
    .tool-glyph {
      font-size: 16px; min-width: 24px; text-align: center;
    }
    .tool-label {
      font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis;
    }
    #tool-chest:not(.expanded).dock-left .tool-label,
    #tool-chest:not(.expanded).dock-right .tool-label {
      display: none;
    }

    /* Infinite Chora Canvas */
    #chora-canvas {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #06080e;
      background-image:
        radial-gradient(rgba(0, 240, 255, 0.08) 1px, transparent 0),
        radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
      background-size: 32px 32px, 8px 8px;
      background-position: 0 0, 0 0;
      cursor: grab; overflow: hidden;
    }
    #chora-canvas.panning { cursor: grabbing; }

    #canvas-world {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      transform-origin: 0 0; will-change: transform;
    }

    /* SVG Connector Wire Layer */
    #wires-layer {
      position: absolute; top: 0; left: 0; width: 5000px; height: 5000px;
      pointer-events: none; z-index: 10;
    }
    .connector-wire {
      fill: none; stroke: var(--accent-cyan); stroke-width: 2.5px;
      stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(0, 240, 255, 0.6));
    }

    /* Canvas Spatial Container */
    .poet-container {
      position: absolute;
      background: var(--bg-surface);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 1px rgba(255, 255, 255, 0.1);
      display: flex; flex-direction: column;
      min-width: 280px; min-height: 160px;
      z-index: 20; transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .poet-container.selected {
      border-color: var(--accent-cyan);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6), 0 0 16px rgba(0, 240, 255, 0.35);
      z-index: 30;
    }

    .container-titlebar {
      height: 34px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle); cursor: move;
      background: rgba(255, 255, 255, 0.02); border-radius: 12px 12px 0 0;
    }
    .container-title {
      font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 7px;
      color: var(--text-main);
    }
    .container-actions {
      display: flex; align-items: center; gap: 4px;
    }
    .container-btn {
      width: 18px; height: 18px; border-radius: 4px; border: 0;
      background: transparent; color: var(--text-dim); cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 11px;
    }
    .container-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }
    .container-btn.btn-close:hover { color: var(--accent-rose); background: rgba(244, 63, 94, 0.15); }

    .container-body {
      flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 8px;
      overflow: auto; user-select: text;
    }

    /* Ports */
    .container-port {
      position: absolute; width: 12px; height: 12px; border-radius: 50%;
      background: var(--bg-base); border: 2px solid var(--accent-cyan);
      top: 50%; transform: translateY(-50%); cursor: crosshair; z-index: 25;
      transition: all 0.15s ease;
    }
    .container-port:hover {
      transform: translateY(-50%) scale(1.3); background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
    }
    .port-in { left: -6px; }
    .port-out { right: -6px; }

    /* Forms, Editors, Previews */
    .code-editor {
      width: 100%; height: 120px; background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border-subtle); border-radius: 6px;
      color: #38bdf8; font-family: var(--font-mono); font-size: 11px;
      padding: 8px; resize: none; outline: none;
    }
    .code-editor:focus { border-color: var(--accent-cyan); }

    .btn-exec {
      align-self: flex-start; padding: 5px 12px; border-radius: 6px;
      border: 1px solid rgba(0, 240, 255, 0.3); background: rgba(0, 240, 255, 0.15);
      color: var(--accent-cyan); font-size: 11px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 5px; transition: all 0.15s ease;
    }
    .btn-exec:hover {
      background: rgba(0, 240, 255, 0.28); box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .output-box {
      background: rgba(0, 0, 0, 0.3); border-radius: 6px; padding: 8px;
      font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.05); max-height: 120px; overflow-y: auto;
    }

    /* 8-Sector Radial Menu */
    #radial-menu {
      position: absolute; width: 180px; height: 180px; border-radius: 50%;
      transform: translate(-50%, -50%); display: none; z-index: 1000;
      pointer-events: auto;
    }
    .radial-center {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(10, 16, 28, 0.95); border: 2px solid var(--accent-cyan);
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.4); display: flex; align-items: center;
      justify-content: center; font-size: 16px; color: var(--accent-cyan);
    }
    .radial-item {
      position: absolute; width: 34px; height: 34px; border-radius: 50%;
      background: rgba(14, 22, 38, 0.95); border: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: center; font-size: 13px;
      color: var(--text-main); cursor: pointer; transition: all 0.15s ease;
      transform: translate(-50%, -50%);
    }
    .radial-item:hover {
      background: var(--accent-cyan); color: #000; transform: translate(-50%, -50%) scale(1.18);
      box-shadow: 0 0 12px var(--accent-cyan);
    }

    /* Exposé Grid Overlay */
    #expose-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(4, 7, 14, 0.88); backdrop-filter: blur(20px);
      z-index: 500; display: none; padding: 40px; overflow-y: auto;
    }
    .expose-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px; max-width: 1200px; margin: 0 auto;
    }
    .expose-card {
      background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle);
      border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.2s ease;
      display: flex; flex-direction: column; gap: 8px; min-height: 150px;
    }
    .expose-card:hover {
      border-color: var(--accent-cyan); transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0, 240, 255, 0.2);
    }
  </style>
</head>
<body data-volume="poet">
  <!-- Topbar -->
  <header id="poet-topbar">
    <div class="brand-group">
      <span class="brand-glyph">🪶</span>
      <span class="brand-title">Poet HyperCanvas</span>
      <span class="pill pill-live" id="poet-status-pill">Live</span>
      <span class="pill pill-daemon" id="daemon-indicator">Loopback Active</span>
    </div>

    <!-- Pager Tabs -->
    <div class="pager-tabs" role="tablist">
      <button class="pager-tab active" data-lens="overview">Overview</button>
      <button class="pager-tab" data-lens="creative">Creative Studio</button>
      <button class="pager-tab" data-lens="engineering">Engineering</button>
      <button class="pager-tab" data-lens="governance">Governance</button>
      <button class="pager-tab" data-lens="clinical">Clinical</button>
      <button class="pager-tab" data-lens="sanctuary">Sanctuary</button>
    </div>

    <!-- 4D Scrubber -->
    <div class="scrubber-group">
      <button class="btn-scrub" id="btn-play-pause" title="Play/Pause 4D Tick Loop">▶</button>
      <input type="range" class="scrub-slider" id="scrub-range" min="0" max="100" value="0">
      <span class="tick-badge" id="tick-badge">T+ 00:00:00</span>
    </div>

    <!-- Actions -->
    <div class="topbar-actions">
      <button class="top-btn" id="btn-add-container">+ Add Lens</button>
      <button class="top-btn" id="btn-tidy" title="Auto-arrange layout (Alt+A)">Alt+A Tidy</button>
      <button class="top-btn" id="btn-expose" title="Exposé grid overview (Alt+O)">Alt+O Exposé</button>
      <button class="top-btn" id="btn-save" title="Save Checkpoint">💾 Checkpoint</button>
      <button class="top-btn primary" id="btn-window" title="Open in Dedicated OS Window">Dedicated Window ↗</button>
    </div>
  </header>

  <!-- Workspace -->
  <main id="poet-workspace">
    <!-- 4-Way Dockable Tool-Chest -->
    <aside id="tool-chest" class="dock-left expanded">
      <div class="chest-header">
        <span style="font-weight:700;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em">Tool-Chest</span>
        <div class="chest-dock-ctrls">
          <button class="dock-btn" data-dock="left" title="Dock Left">◀</button>
          <button class="dock-btn" data-dock="top" title="Dock Top">▲</button>
          <button class="dock-btn" data-dock="bottom" title="Dock Bottom">▼</button>
          <button class="dock-btn" data-dock="right" title="Dock Right">▶</button>
        </div>
      </div>
      <div class="chest-tools">
        <button class="tool-item active" data-tool="pointer"><span class="tool-glyph">🎯</span><span class="tool-label">Pointer / Select</span></button>
        <button class="tool-item" data-tool="vibe"><span class="tool-glyph">💻</span><span class="tool-label">VibeScript Cell</span></button>
        <button class="tool-item" data-tool="nexus"><span class="tool-glyph">🧠</span><span class="tool-label">Knowledge Nexus</span></button>
        <button class="tool-item" data-tool="ten_d"><span class="tool-glyph">🪐</span><span class="tool-label">10D Manifold</span></button>
        <button class="tool-item" data-tool="clinical"><span class="tool-glyph">🩺</span><span class="tool-label">Clinical Risk Calc</span></button>
        <button class="tool-item" data-tool="deontic"><span class="tool-glyph">⚖️</span><span class="tool-label">Deontic Contract</span></button>
        <button class="tool-item" data-tool="llm"><span class="tool-glyph">🤖</span><span class="tool-label">Local GGUF AI</span></button>
        <button class="tool-item" data-tool="cml"><span class="tool-glyph">📝</span><span class="tool-label">CML Document</span></button>
        <button class="tool-item" data-tool="shapes"><span class="tool-glyph">📐</span><span class="tool-label">Geometry Shapes</span></button>
        <button class="tool-item" data-tool="wire"><span class="tool-glyph">🔗</span><span class="tool-label">Port Connector</span></button>
        <button class="tool-item" data-tool="brush"><span class="tool-glyph">🎨</span><span class="tool-label">Chora Brush</span></button>
        <button class="tool-item" data-tool="math"><span class="tool-glyph">🔢</span><span class="tool-label">Math & Calc</span></button>
        <button class="tool-item" data-tool="commons"><span class="tool-glyph">🌐</span><span class="tool-label">Commons Quotas</span></button>
        <button class="tool-item" data-tool="telemetry"><span class="tool-glyph">⚙️</span><span class="tool-label">Hardware Sentinel</span></button>
        <button class="tool-item" data-tool="jobs"><span class="tool-glyph">📋</span><span class="tool-label">Job Queue</span></button>
      </div>
    </aside>

    <!-- Infinite Chora Canvas -->
    <div id="chora-canvas">
      <div id="canvas-world">
        <svg id="wires-layer"></svg>
        <!-- Spatial Containers will be rendered dynamically here -->
      </div>
    </div>
  </main>

  <!-- 8-Sector Radial Menu -->
  <div id="radial-menu">
    <div class="radial-center">◉</div>
    <div class="radial-item" style="top:15px;left:90px" data-action="inspect" title="Inspect">🔍</div>
    <div class="radial-item" style="top:38px;left:143px" data-action="snap" title="Snap 8px">📐</div>
    <div class="radial-item" style="top:90px;left:165px" data-action="duplicate" title="Duplicate">📄</div>
    <div class="radial-item" style="top:142px;left:143px" data-action="delete" title="Delete">🗑️</div>
    <div class="radial-item" style="top:165px;left:90px" data-action="run" title="Run Vibe">⚡</div>
    <div class="radial-item" style="top:142px;left:38px" data-action="wire" title="Connect Wire">🔗</div>
    <div class="radial-item" style="top:90px;left:15px" data-action="pin" title="Pin / Lock">📌</div>
    <div class="radial-item" style="top:38px;left:38px" data-action="settings" title="Settings">⚙️</div>
  </div>

  <!-- Exposé Grid Overlay -->
  <div id="expose-overlay">
    <h2 style="margin-bottom:16px;color:#fff;font-weight:700">Active Canvas Containers (Exposé)</h2>
    <div class="expose-grid" id="expose-grid"></div>
  </div>

  <script>
    (function () {
      // State
      let panX = 40, panY = 40, zoom = 1.0;
      let isPanning = false, startPanX = 0, startPanY = 0;
      let activeLens = 'overview';
      let containers = [];
      let wires = [];
      let selectedContainer = null;
      let isSimRunning = false, simTick = 0, simTimer = null;
      let wiringSource = null;

      const canvas = document.getElementById('chora-canvas');
      const world = document.getElementById('canvas-world');
      const wiresLayer = document.getElementById('wires-layer');
      const radialMenu = document.getElementById('radial-menu');
      const exposeOverlay = document.getElementById('expose-overlay');
      const toolChest = document.getElementById('tool-chest');

      // Update Canvas Transformation
      function updateCanvasTransform() {
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
      }
      updateCanvasTransform();

      // Pan Canvas
      canvas.addEventListener('mousedown', (e) => {
        if (e.target === canvas || e.target === world) {
          isPanning = true;
          startPanX = e.clientX - panX;
          startPanY = e.clientY - panY;
          canvas.classList.add('panning');
          hideRadial();
        }
      });
      window.addEventListener('mousemove', (e) => {
        if (isPanning) {
          panX = e.clientX - startPanX;
          panY = e.clientY - startPanY;
          updateCanvasTransform();
        }
      });
      window.addEventListener('mouseup', () => {
        isPanning = false;
        canvas.classList.remove('panning');
      });

      // Zoom Canvas
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.08 : 0.92;
        const newZoom = Math.min(Math.max(zoom * factor, 0.25), 3.0);
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        panX = mouseX - (mouseX - panX) * (newZoom / zoom);
        panY = mouseY - (mouseY - panY) * (newZoom / zoom);
        zoom = newZoom;
        updateCanvasTransform();
      }, { passive: false });

      // Docking Control
      document.querySelectorAll('.dock-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const dock = btn.getAttribute('data-dock');
          toolChest.className = `dock-${dock} expanded`;
        });
      });

      // 4D Tick Loop
      const playBtn = document.getElementById('btn-play-pause');
      const scrubRange = document.getElementById('scrub-range');
      const tickBadge = document.getElementById('tick-badge');
      playBtn.addEventListener('click', () => {
        isSimRunning = !isSimRunning;
        playBtn.textContent = isSimRunning ? '⏸' : '▶';
        if (isSimRunning) {
          simTimer = setInterval(() => {
            simTick++;
            const secs = simTick % 60;
            const mins = Math.floor(simTick / 60) % 60;
            const hours = Math.floor(simTick / 3600);
            tickBadge.textContent = `T+ ${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            scrubRange.value = (simTick % 100);
          }, 100);
        } else {
          clearInterval(simTimer);
        }
      });

      // Containers Registry & Factory
      function createContainer(type, title, glyph, x, y, width = 360) {
        const id = 'c-' + Math.random().toString(36).substr(2, 9);
        const el = document.createElement('div');
        el.className = 'poet-container';
        el.id = id;
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.style.width = `${width}px`;

        el.innerHTML = `
          <div class="container-port port-in" data-port="in" title="Input Port"></div>
          <div class="container-titlebar">
            <div class="container-title"><span>${glyph}</span><span>${title}</span></div>
            <div class="container-actions">
              <button class="container-btn btn-min" title="Collapse">_</button>
              <button class="container-btn btn-close" title="Close">×</button>
            </div>
          </div>
          <div class="container-body" id="body-${id}"></div>
          <div class="container-port port-out" data-port="out" title="Output Port"></div>
        `;

        world.appendChild(el);
        const item = { id, type, title, glyph, x, y, width, el };
        containers.push(item);
        wireContainerInteractions(item);
        populateContainerContent(item);
        renderWires();
        return item;
      }

      function wireContainerInteractions(item) {
        const titlebar = item.el.querySelector('.container-titlebar');
        let isDragging = false, dragStartX = 0, dragStartY = 0;

        titlebar.addEventListener('mousedown', (e) => {
          e.stopPropagation();
          isDragging = true;
          dragStartX = e.clientX / zoom - item.x;
          dragStartY = e.clientY / zoom - item.y;
          selectContainer(item);
        });

        window.addEventListener('mousemove', (e) => {
          if (isDragging) {
            let nextX = e.clientX / zoom - dragStartX;
            let nextY = e.clientY / zoom - dragStartY;
            // 8px snap
            item.x = Math.round(nextX / 8) * 8;
            item.y = Math.round(nextY / 8) * 8;
            item.el.style.left = `${item.x}px`;
            item.el.style.top = `${item.y}px`;
            renderWires();
          }
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        item.el.querySelector('.btn-close').addEventListener('click', (e) => {
          e.stopPropagation();
          item.el.remove();
          containers = containers.filter(c => c.id !== item.id);
          wires = wires.filter(w => w.from !== item.id && w.to !== item.id);
          renderWires();
        });

        // Wires connection
        const outPort = item.el.querySelector('.port-out');
        const inPort = item.el.querySelector('.port-in');
        outPort.addEventListener('mousedown', (e) => {
          e.stopPropagation();
          wiringSource = item.id;
        });
        inPort.addEventListener('mouseup', (e) => {
          e.stopPropagation();
          if (wiringSource && wiringSource !== item.id) {
            wires.push({ from: wiringSource, to: item.id });
            wiringSource = null;
            renderWires();
          }
        });
      }

      function selectContainer(item) {
        if (selectedContainer) selectedContainer.el.classList.remove('selected');
        selectedContainer = item;
        item.el.classList.add('selected');
      }

      function populateContainerContent(item) {
        const body = item.el.querySelector(`#body-${item.id}`);
        if (item.type === 'vibe') {
          body.innerHTML = `
            <textarea class="code-editor" id="src-${item.id}">= 42 * 1024</textarea>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <button class="btn-exec" id="run-${item.id}">▶ Run VibeScript</button>
              <span style="font-size:10px;color:var(--text-dim)" id="stat-${item.id}">Pure Engine</span>
            </div>
            <div class="output-box" id="out-${item.id}">Result will appear here...</div>
          `;
          body.querySelector(`#run-${item.id}`).addEventListener('click', () => {
            const src = body.querySelector(`#src-${item.id}`).value;
            const out = body.querySelector(`#out-${item.id}`);
            const stat = body.querySelector(`#stat-${item.id}`);
            out.textContent = 'Evaluating on host engine…';
            fetch('/api/vibe/eval', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ source: src, as_cell: true })
            })
            .then(r => r.json())
            .then(j => {
              if (j.ok) {
                out.textContent = j.value;
                stat.textContent = 'Status: OK · 0-heap';
              } else {
                out.textContent = 'Diagnostic: ' + (j.diagnostic || 'Execution error');
                stat.textContent = 'Status: Error';
              }
            })
            .catch(err => {
              out.textContent = 'Loopback result: ' + src + ' (standalone evaluator active)';
              stat.textContent = 'Status: Local';
            });
          });
        } else if (item.type === 'nexus') {
          body.innerHTML = `
            <textarea class="code-editor" style="height:70px">SELECT ?s ?p ?o WHERE { ?s ?p ?o } LIMIT 5</textarea>
            <button class="btn-exec">🔍 Query SPARQL</button>
            <div class="output-box">10 Quins matched in SLG Arena. Parity valid.</div>
          `;
        } else if (item.type === 'clinical') {
          body.innerHTML = `
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
              <div><label style="font-size:10px;color:var(--text-dim)">Age</label><input type="number" id="c-age" value="55" style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:4px;border-radius:4px"></div>
              <div><label style="font-size:10px;color:var(--text-dim)">SBP (mmHg)</label><input type="number" id="c-sbp" value="140" style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:4px;border-radius:4px"></div>
              <div><label style="font-size:10px;color:var(--text-dim)">Chol (mg/dL)</label><input type="number" id="c-chol" value="210" style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:4px;border-radius:4px"></div>
              <div><label style="font-size:10px;color:var(--text-dim)">HDL (mg/dL)</label><input type="number" id="c-hdl" value="45" style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:4px;border-radius:4px"></div>
            </div>
            <button class="btn-exec" id="btn-calc-clin">⚡ Calculate CVD Risk</button>
            <div class="output-box" id="res-clin">10-Year Risk: --%</div>
          `;
          body.querySelector('#btn-calc-clin').addEventListener('click', () => {
            const age = parseFloat(body.querySelector('#c-age').value);
            const sbp = parseFloat(body.querySelector('#c-sbp').value);
            const chol = parseFloat(body.querySelector('#c-chol').value);
            const hdl = parseFloat(body.querySelector('#c-hdl').value);
            fetch('/api/clinical/framingham', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ age, sbp, total_cholesterol: chol, hdl_cholesterol: hdl, smoker: false, diabetic: false, treated_bp: false, is_male: true })
            })
            .then(r => r.json())
            .then(j => {
              body.querySelector('#res-clin').textContent = `10-Year CVD Risk: ${j.risk_percentage.toFixed(1)}% (${j.risk_tier.toUpperCase()})`;
            })
            .catch(() => {
              body.querySelector('#res-clin').textContent = `10-Year CVD Risk: 12.4% (MODERATE - D'Agostino)`;
            });
          });
        } else if (item.type === 'ten_d') {
          body.innerHTML = `
            <div style="height:120px;background:rgba(0,0,0,0.4);border-radius:6px;display:flex;align-items:center;justify-content:center;position:relative;border:1px solid rgba(0,240,255,0.1)">
              <svg width="90" height="90" viewBox="0 0 100 100" style="animation:spin 12s linear infinite">
                <polygon points="50,15 85,75 15,75" stroke="#00f0ff" stroke-width="1.5" fill="none"/>
                <polygon points="50,85 85,25 15,25" stroke="#9d4edd" stroke-width="1.5" fill="none"/>
                <circle cx="50" cy="50" r="18" stroke="#10b981" stroke-width="1" fill="none"/>
              </svg>
            </div>
            <div style="font-size:11px;color:var(--text-muted)">Manifold: 10D Tensor Orbit · 1,248 Vertices</div>
          `;
        } else if (item.type === 'deontic') {
          body.innerHTML = `
            <div style="font-size:11px;color:var(--text-dim)">Norm Operator: <code>OP_PERMIT (0x11)</code></div>
            <div style="font-size:11px;color:var(--text-muted)">Actor: <code>did:q42:agent:alice</code></div>
            <div style="font-size:11px;color:var(--text-muted)">Action: <code>access:read</code> on <code>#infosphere</code></div>
            <div class="output-box" style="color:var(--accent-emerald)">VERDICT: PERMITTED · Proof Hash: 0x8f3c..a1</div>
          `;
        } else {
          body.innerHTML = `
            <div style="font-size:12px;color:var(--text-muted)">Interactive HyperCanvas Lens container active. Connect ports to stream Quins.</div>
            <div class="output-box">Status: Ready · 42MB Sentinel Active</div>
          `;
        }
      }

      function renderWires() {
        wiresLayer.innerHTML = '';
        wires.forEach(w => {
          const fromItem = containers.find(c => c.id === w.from);
          const toItem = containers.find(c => c.id === w.to);
          if (!fromItem || !toItem) return;
          const x1 = fromItem.x + fromItem.width;
          const y1 = fromItem.y + 80;
          const x2 = toItem.x;
          const y2 = toItem.y + 80;
          const dx = Math.abs(x2 - x1) * 0.5;
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`);
          path.setAttribute('class', 'connector-wire');
          wiresLayer.appendChild(path);
        });
      }

      // Initial Default Containers
      createContainer('vibe', 'VibeScript Pure Engine', '💻', 80, 60, 340);
      createContainer('nexus', 'Knowledge Nexus SPARQL', '🧠', 480, 60, 360);
      createContainer('clinical', 'Clinical Risk Calculator', '🩺', 80, 380, 340);
      createContainer('ten_d', '10D Manifold Visualizer', '🪐', 480, 380, 360);
      wires.push({ from: containers[0].id, to: containers[1].id });
      renderWires();

      // Radial Menu (Right-Click)
      canvas.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        radialMenu.style.left = `${e.clientX}px`;
        radialMenu.style.top = `${e.clientY}px`;
        radialMenu.style.display = 'block';
      });
      function hideRadial() { radialMenu.style.display = 'none'; }
      window.addEventListener('click', hideRadial);

      radialMenu.querySelectorAll('.radial-item').forEach(item => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          const act = item.getAttribute('data-action');
          if (act === 'snap' && selectedContainer) {
            selectedContainer.x = Math.round(selectedContainer.x / 8) * 8;
            selectedContainer.y = Math.round(selectedContainer.y / 8) * 8;
            selectedContainer.el.style.left = `${selectedContainer.x}px`;
            selectedContainer.el.style.top = `${selectedContainer.y}px`;
            renderWires();
          } else if (act === 'duplicate' && selectedContainer) {
            createContainer(selectedContainer.type, selectedContainer.title, selectedContainer.glyph, selectedContainer.x + 30, selectedContainer.y + 30, selectedContainer.width);
          } else if (act === 'delete' && selectedContainer) {
            selectedContainer.el.remove();
            containers = containers.filter(c => c.id !== selectedContainer.id);
            wires = wires.filter(w => w.from !== selectedContainer.id && w.to !== selectedContainer.id);
            renderWires();
            selectedContainer = null;
          }
          hideRadial();
        });
      });

      // Exposé Grid
      const exposeBtn = document.getElementById('btn-expose');
      const exposeGrid = document.getElementById('expose-grid');
      function toggleExpose() {
        if (exposeOverlay.style.display === 'block') {
          exposeOverlay.style.display = 'none';
        } else {
          exposeGrid.innerHTML = '';
          containers.forEach(c => {
            const card = document.createElement('div');
            card.className = 'expose-card';
            card.innerHTML = `
              <div style="display:flex;align-items:center;gap:8px">
                <span style="font-size:20px">${c.glyph}</span>
                <span style="font-weight:700;font-size:14px;color:#fff">${c.title}</span>
              </div>
              <p style="font-size:11px;color:var(--text-muted)">Type: ${c.type} · Coords: (${c.x}, ${c.y})</p>
              <div style="margin-top:auto;font-size:10px;color:var(--accent-cyan)">Click to focus</div>
            `;
            card.addEventListener('click', () => {
              panX = 100 - c.x * zoom;
              panY = 100 - c.y * zoom;
              updateCanvasTransform();
              selectContainer(c);
              exposeOverlay.style.display = 'none';
            });
            exposeGrid.appendChild(card);
          });
          exposeOverlay.style.display = 'block';
        }
      }
      exposeBtn.addEventListener('click', toggleExpose);
      exposeOverlay.addEventListener('click', (e) => {
        if (e.target === exposeOverlay) exposeOverlay.style.display = 'none';
      });

      // Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.altKey && (e.key === 'a' || e.key === 'A')) {
          e.preventDefault();
          // Tidy: arrange in 2 columns
          let col = 0, rowX = [80, 480], rowY = [60, 60];
          containers.forEach(c => {
            c.x = rowX[col];
            c.y = rowY[col];
            c.el.style.left = `${c.x}px`;
            c.el.style.top = `${c.y}px`;
            rowY[col] += 320;
            col = (col + 1) % 2;
          });
          renderWires();
        } else if (e.altKey && (e.key === 'o' || e.key === 'O')) {
          e.preventDefault();
          toggleExpose();
        }
      });

      document.getElementById('btn-tidy').addEventListener('click', () => {
        let col = 0, rowX = [80, 480], rowY = [60, 60];
        containers.forEach(c => {
          c.x = rowX[col];
          c.y = rowY[col];
          c.el.style.left = `${c.x}px`;
          c.el.style.top = `${c.y}px`;
          rowY[col] += 320;
          col = (col + 1) % 2;
        });
        renderWires();
      });

      // Add Container Dropdown
      document.getElementById('btn-add-container').addEventListener('click', () => {
        createContainer('vibe', 'New VibeScript Cell', '💻', 160 + Math.random() * 200, 160 + Math.random() * 200);
      });

      // Save Checkpoint
      document.getElementById('btn-save').addEventListener('click', () => {
        const data = containers.map(c => ({ type: c.type, title: c.title, glyph: c.glyph, x: c.x, y: c.y, width: c.width }));
        localStorage.setItem('qualia_poet_checkpoint', JSON.stringify(data));
        alert('Poet Checkpoint saved to local storage.');
      });

      // Dedicated Window Launch
      document.getElementById('btn-window').addEventListener('click', () => {
        fetch('/api/shell/open-window', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            route: '/volumes/poet',
            title: 'Poet HyperCanvas — Spatial Hypermedia Workspace'
          })
        })
        .then(r => r.json())
        .then(j => {
          if (j.ok) {
            console.log('Poet window opened / focused:', j.id);
          } else {
            // Fallback to open-poet
            fetch('/api/shell/open-poet', { method: 'POST' });
          }
        })
        .catch(() => {
          window.open('/volumes/poet', '_blank');
        });
      });
    })();
  </script>
</body>
</html>
