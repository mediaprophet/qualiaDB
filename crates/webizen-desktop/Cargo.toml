[package]
name = "webizen-desktop"
version = "0.0.29"
edition = "2021"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]

[lib]
name = "webizen_desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["protocol-asset", "tray-icon", "image-png", "unstable"] }
tauri-plugin-updater = "2.10"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["cors", "fs", "set-header"] }
base64 = "0.22"
open = "5"
qualia-core-db = { path = "../qualia-core-db" }
qualia-client-core = { path = "../qualia-client-core" }
qualia-vision = { path = "../qualia-vision" }
wellfare-core = { path = "../wellfare-core" }
qualia-cooperative-core = { path = "../qualia-cooperative-core" }
webizen-runtime = { path = "../webizen-runtime" }
webizen-render = { path = "../webizen-render" }
webizen-studio = { path = "../webizen-studio" }
qualia-semantic-library = { path = "../qualia-semantic-library" }
futures-util = "0.3"
mime_guess = "2.0"
pdf-extract = "0.12"
rtrb = "0.3.1"
byteorder = "1.5"
bip39 = { version = "2.2.2", features = ["rand"] }
rand = "0.10.1"
librqbit = "8"
ed25519-dalek = { version = "3", features = ["rand_core"] }
hex = "0.4.3"
uuid = { version = "1.10", features = ["v4"] }
urlencoding = "2.1"
chrono = "0.4"
log = "0.4"
crossbeam-channel = "0.5.15"
pollster = "1"
fast_qr = { version = "0.13.1", features = ["svg"] }
raw-window-handle = "0.6"
webrtc = "0.17.1"
scraper = "0.27.0"
cpal = "0.15"
qualia-audio = { path = "../qualia-audio" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }
# Same major as Tauri/wry stack — ServerCertificateErrorDetected (C1).
webview2-com = "0.38"
# Interface::cast must match webview2-com's windows-core (0.61), not our windows 0.62.
windows-core-wv2 = { package = "windows-core", version = "0.61.2" }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
# Experimental Servo engine path (S1/S2). Off by default.
# Does NOT link libservo in this build — compile-time markers + docs/UI surface only.
# Default `cargo check -p webizen-desktop` stays free of any Servo dependency.
# See docs/plans/servo-experimental.md for the future embed plug-in contract.
servo = []
