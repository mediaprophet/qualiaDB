[package]
name = "webizen-desktop"
version = "0.0.39"
edition = "2021"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]

[lib]
name = "webizen_desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["protocol-asset", "tray-icon", "image-png", "unstable"] }
tauri-plugin-updater = "2.10"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true, default-features = false, features = ["rustls", "json", "stream", "blocking"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["cors", "fs", "set-header"] }
base64 = { workspace = true, default-features = true }
open = "5"
qualia-core-db = { workspace = true, default-features = true }
vibe = { workspace = true }
qualia-client-core = { workspace = true }
qualia-vision = { workspace = true }
wellfare-core = { workspace = true }
qualia-cooperative-core = { workspace = true }
webizen-runtime = { workspace = true }
webizen-render = { workspace = true }
webizen-studio = { workspace = true }
qualia-semantic-library = { workspace = true }
futures-util = { workspace = true }
mime_guess = "2.0"
pdf-extract = { workspace = true }
rtrb = { workspace = true }
byteorder = { workspace = true }
bip39 = { workspace = true, features = ["rand"] }
rand = { workspace = true }
librqbit = "8"
ed25519-dalek = { workspace = true, default-features = true, features = ["rand_core"] }
hex = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
urlencoding = { workspace = true }
chrono = { workspace = true, default-features = true }
log = { workspace = true }
crossbeam-channel = { workspace = true }
pollster = { workspace = true }
fast_qr = { workspace = true, features = ["svg"] }
raw-window-handle = { workspace = true }
webrtc = "0.17.1"
scraper = { workspace = true }
cpal = { workspace = true }
qualia-audio = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }
# Same major as Tauri/wry stack — ServerCertificateErrorDetected (C1).
webview2-com = "0.38"
# Interface::cast must match webview2-com's windows-core (0.61), not our windows 0.62.
windows-core-wv2 = { package = "windows-core", version = "0.61.2" }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"
gio = "0.18"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
# Experimental Servo engine path (S1/S2). Off by default.
# Does NOT link libservo in this build — compile-time markers + docs/UI surface only.
# Default `cargo check -p webizen-desktop` stays free of any Servo dependency.
# See docs/plans/servo-experimental.md for the future embed plug-in contract.
servo = []
