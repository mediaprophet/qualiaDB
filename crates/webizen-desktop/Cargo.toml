[package]
name = "webizen-desktop"
version = "0.0.23"
edition = "2021"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "protocol-asset", "os-all", "updater", "system-tray" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs", "set-header"] }
base64 = "0.22"
open = "5"
qualia-core-db = { path = "../qualia-core-db" }
qualia-client-core = { path = "../qualia-client-core" }
webizen-runtime = { path = "../webizen-runtime" }
webizen-render = { path = "../webizen-render" }
webizen-studio = { path = "../webizen-studio" }
futures-util = "0.3"
mime_guess = "2.0"
pdf-extract = "0.7"
rtrb = "0.3.1"
byteorder = "1.5"
bip39 = { version = "2.2.2", features = ["rand"] }
rand = "0.10.1"
librqbit = "8"
ed25519-dalek = { version = "2.0.0", features = ["rand_core"] }
hex = "0.4.3"
uuid = { version = "1.10", features = ["v4"] }
urlencoding = "2.1"
chrono = "0.4"
crossbeam-channel = "0.5.15"
pollster = "0.4.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

