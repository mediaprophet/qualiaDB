[package]
name = "qualia-core-db"
version = "0.0.20"
edition = "2021"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]

[features]
default = ["profile_target_1024", "zk-culling", "gpu-runtime"]

# ── Qualia WASM portal build profiles (use with --no-default-features on wasm32) ──
# Ontology MCP kernel:              --features wasm-ontology (exclusive)
# Slim GitHub Pages / QApp export:  --features portal
# Logic demos (N3/SHACL):           --features wasm-logic
# Science playground:               --features wasm-scientific
# Browser model runtime:            --features wasm-llm
# Full API explorer / playground:   --features wasm-full
gpu-runtime = ["dep:wgpu"]
portal = ["wasm_simd", "gpu-runtime"]
wasm-ontology = []
wasm-logic = []
wasm-scientific = ["gpu-runtime"]
wasm-llm = ["gpu-runtime", "wasm-logic", "wasm-scientific"]
wasm-playground = ["wasm-logic", "wasm-scientific"]
wasm-full = ["portal", "wasm-logic", "wasm-scientific", "wasm-llm", "wasm-playground"]

# Enforces explicit stack boundaries restricting memory caching paths under 512MB RAM rules
profile_minimal_512 = []
profile_target_1024 = ["alloc_buffers"]
profile_accelerated = ["alloc_buffers", "neon_simd_unroll"]
# Enables the WASM SIMD vectorized execution branch in webizen_bytecode.
# Only has effect on wasm32 targets compiled with SIMD support (-C target-feature=+simd128).
wasm_simd = []

# Interoperability cryptographic algorithms for W3C DID compatibility
# Enables secp256k1 (ECDSA) for interoperability with existing Web 2.0 infrastructure
# This feature can be disabled for pure post-quantum environments
interop-crypto = ["secp256k1", "rsa"]

# Sanctuary lane cryptography with 48-byte PBKDF2 derivation
# Enables PBKDF2 and AEAD ciphers for sanctuary volume encryption
sanctuary-crypto = ["pbkdf2"]

# 10D volumetric tensor system for Q42 volumes
# Enables 10D tensor coordinate system [q, v, w, x, y, z, t, α, μ, σ]
tensor-10d = []

# Hardware acceleration features for tensor operations
tensor-gpu = []  # Enable GPU acceleration (CUDA/Metal/Vulkan)
tensor-npu = []  # Enable NPU acceleration (Neural Engine)

# Zero-knowledge proofs for Deontic Culling layer
# Using arkworks ecosystem for unified, maintainable ZK infrastructure
zk-culling = ["ark-bls12-381", "ark-groth16", "ark-relations", "ark-snark", "ark-ff", "ark-serialize", "ark-ec", "ark-std"]

# Post-quantum KEM encapsulation + fixed-size serialization shim
pq-kem = ["thiserror"]

# QPU internal functionality (undocumented, private)
# This feature gate enables internal QPU modules that are not publicly documented
qpu_internal = []

# Mock cryptography for preserving 25-year stubs without infecting production


# Feature dependencies
alloc_buffers = []
neon_simd_unroll = []
vm_tracing = []

[dependencies]
minicbor = { version = "0.20", features = ["std"] }
futures-core = { version = "0.3", default-features = false }
futures-channel = "0.3"
futures-intrusive = { version = "0.5", default-features = false, features = ["alloc"] }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_bytes = "0.11"
bytemuck = { version = "1.14", features = ["derive"] }
half = "2.4"
log = "0.4"
ed25519-dalek = { version = "2.1", default-features = false }
secp256k1 = { version = "0.31", default-features = false, features = ["std", "rand"], optional = true }
# arkworks ecosystem for zero-knowledge proofs
ark-bls12-381 = { version = "0.6", default-features = false, features = ["curve"], optional = true }
ark-groth16 = { version = "0.6", default-features = false, optional = true }
ark-relations = { version = "0.6", default-features = false, optional = true }
ark-snark = { version = "0.6", default-features = false, optional = true }
ark-ff = { version = "0.6", default-features = false, optional = true }
ark-serialize = { version = "0.6", default-features = false, optional = true }
ark-ec = { version = "0.6", default-features = false, optional = true }
ark-std = { version = "0.6", default-features = false, features = ["std"], optional = true }
rsa = { version = "0.9", default-features = false, features = ["sha2", "pem", "u64_digit"], optional = true }
thiserror = { version = "2.0", optional = true }
sha2 = { version = "0.11", default-features = false }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"], optional = true }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
aead = { version = "0.5", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
hkdf = { version = "0.13", default-features = false }
blake3 = { version = "1", default-features = false }
fips204 = { version = "0.4", default-features = false, features = ["ml-dsa-65", "default-rng"] }
fips203 = { version = "0.4", default-features = false, features = ["ml-kem-512", "ml-kem-768", "ml-kem-1024", "default-rng"] }
fips205 = { version = "0.4", default-features = false, features = ["slh_dsa_sha2_256s", "default-rng"] }
quick-xml = "0.40"
regex = "1"
crossbeam-channel = "0.5"
core_affinity = "0.8"
num_cpus = "1.16"
rio_xml = "0.8"

rio_turtle = "0.8"
rio_api = "0.8"
lz4_flex = "0.13"
rtrb = "0.3.4"
rand = "0.10.1"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4.3"
sha1 = "0.11"
sha3 = "0.12"
urlencoding = "2.1"
csv = "1.3"
atoi = "3.0"
ciborium = "0.2.2"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
async-trait = "0.1.89"
dashmap = "6.2.1"
rand_distr = "0.6.0"
fast_qr = { version = "0.13.1", features = ["svg"] }
wgpu = { version = "29", features = ["webgpu"], optional = true }


[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
pollster = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "StorageManager",
    "StorageEstimate",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemSyncAccessHandle",
    "FileSystemWritableFileStream",
    "FileSystemGetFileOptions",
    "File",
    "Blob",
    "Navigator",
    "Window",
    "WebSocket",
    "MessageEvent",
    "ErrorEvent",
    "Event",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "console",
] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen-futures = "0.4"

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
# Force a specific, stable version to prevent transitive conflicts and 32-bit fallback macros
windows = { version = "0.62", features = [
    "Win32_AI_MachineLearning_DirectML",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Ioctl",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_System_Rpc",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"
memmap2 = "0.9"
futures-util = "0.3"
# Tiny block-on executor for one-shot async device probes (H1(a) cross-circuit benchmark).
pollster = "0.4"
tokio = { version = "1.0", features = ["full"] }
rayon = "1.12.0"
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7", features = ["fs", "cors", "set-header"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
http-body-util = "0.1.3"
zstd = "0.13"
sysinfo = "0.39.3"
libp2p = { version = "0.56.0", features = ["tcp", "dns", "noise", "yamux", "request-response", "kad", "mdns", "macros", "tokio"] }
reqwest = { version = "0.13.4", features = ["json", "rustls"] }
boringtun = "0.7.1"
rcgen = "0.14.8"
# DNSSEC and WireGuard dependencies for SocialWebNet bootstrapping
trust-dns-resolver = { version = "0.23.2", features = ["dnssec-ring", "dns-over-rustls"] }
# wireguard-rs = "0.1.1" # Currently unavailable - commented out
base64 = "0.22"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
serde-wasm-bindgen = "0.6.5"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.12"

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in"] }
criterion = "0.8.2"
dhat = "0.3.3"
proptest = "1.11.0"
tempfile = "3.10"
serial_test = "3"
pollster = "0.4.0"

[package.metadata.wasm-pack.profile.release]
# wasm-opt -Oz was rewriting large `vec![0; n]` fills into bulk-memory ops that
# trapped ("memory access out of bounds") on the first real GGUF copy in
# initialize_webgpu_engine. Disabled until a safe opt set is confirmed.
wasm-opt = false

[[bench]]
name = "qualia_benchmark"
harness = false

[[bench]]
name = "ram_usage"
harness = false


csv = "1.3"
atoi = "3.0"

