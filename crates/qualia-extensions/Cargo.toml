[package]
name = "qualia-extensions"
version = "0.0.39"
edition = "2021"
description = "Advanced computational extensions for QualiaDB"
license = "MIT"
authors = ["QualiaDB Team"]

[dependencies]
# Core dependencies
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
clap = { workspace = true, features = ["derive"] }

# Native Qualia pipeline (replaces Candle for PINN)
qualia-core-db = { workspace = true, default-features = true, optional = true }
qualia-q-forge = { workspace = true, optional = true }

# WebGPU dependencies
wgpu = { workspace = true, optional = true }
winit = { version = "0.30", optional = true }

# HTTP client for QPU APIs
reqwest = { workspace = true, features = ["json"], optional = true }

# Base64 encoding for SMX format
base64 = { workspace = true, default-features = true }

# Random number generation for noise
rand = { workspace = true }

# Math utilities
nalgebra = { version = "0.35", default-features = false }
approx = "0.5"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Configuration
config = "0.15.25"

[dev-dependencies]
tokio-test = "0.4"
criterion = { workspace = true }

[features]
default = ["qpu", "pinn", "webgpu"]
qpu = ["reqwest", "qualia-q-forge"]
pinn = ["qualia-core-db", "wgpu"]  # Use native Qualia pipeline instead of Candle
webgpu = ["wgpu", "winit"]

[lib]
name = "qualia_extensions"
path = "src/lib.rs"

[[bin]]
name = "qualia-extensions-daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "qualia-extensions-cli"
path = "src/bin/cli.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
