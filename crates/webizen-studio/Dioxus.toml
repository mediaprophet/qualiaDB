[application]
name = "webizen-studio"
default_theme = "dark"

[web.app]
# base_path removed for Tauri desktop app compatibility
# base_path = "webizen-browser"  # This is for GitHub Pages, not Tauri

# Skip Binaryen. The studio wasm is built without fat LTO (see workspace
# [profile.web-release]); wasm-opt then SIGABRTs with
# "compile unit size was incorrect (this may be an unsupported version of DWARF)".
# dx 0.8 currently continues after that abort — do not depend on it.
# level "0" = do not run the optimizer.
[web.wasm_opt]
level = "0"
