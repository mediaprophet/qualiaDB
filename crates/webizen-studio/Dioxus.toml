[application]
name = "webizen-studio"
default_theme = "dark"

[web.app]
# base_path removed for Tauri desktop app compatibility
# base_path = "webizen-browser"  # This is for GitHub Pages, not Tauri

# dx 0.8 always runs wasm-opt on `--release` web builds. Un-LTO studio wasm
# currently makes Binaryen SIGABRT ("compile unit size was incorrect" /
# DWARF). dx then keeps the pre-opt wasm and still exits 0. Do not treat
# that ERROR line as a failed frontend build.
[web.wasm_opt]
level = "s"
