[application]
name = "webizen-studio"
default_theme = "dark"

[web.app]
# base_path removed for Tauri desktop app compatibility
# base_path = "webizen-browser"  # This is for GitHub Pages, not Tauri

# dx 0.8 still invokes wasm-opt on every --release web build (even level 0
# is `-O0`). Un-LTO studio wasm with DWARF makes Binaryen SIGABRT
# ("compile unit size was incorrect"). scripts/build_frontend.* pass
# `-C debuginfo=0` so there is no DWARF for wasm-opt to choke on.
[web.wasm_opt]
level = "s"
