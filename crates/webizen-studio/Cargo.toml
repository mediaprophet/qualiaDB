[package]
name = "webizen-studio"
version = "0.0.39"
edition = "2021"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
futures-util = { workspace = true }
base64 = { workspace = true, default-features = true }
reqwest = { workspace = true, default-features = false, features = ["json"] }

# ── Native-only dependencies (webizen-desktop uses webizen-studio as a library) ─
# These give the native build access to the render pipeline types.
# dioxus is included with "router" only (not "desktop") to avoid wry conflicts.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus = { workspace = true, features = ["router"] }
qualia-core-db = { workspace = true, default-features = true }
webizen-render = { workspace = true }
qualia-client-core = { workspace = true }
tokio = { workspace = true, features = ["full"] }
dirs-next = "2.0.0"

# ── WASM-only dependencies ────────────────────────────────────────────────────
[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { workspace = true, features = ["router", "web"] }
uuid = { workspace = true, features = ["v4", "js"] }
# Exact pin: must match installed wasm-bindgen-cli (see scripts/build_frontend.*).
# Mismatch surfaces as: failed to find `__wbindgen_externref_table_dealloc` (mac CI).
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["CanvasRenderingContext2d", "Clipboard", "Document", "Element", "EventSource", "History", "HtmlCanvasElement", "ImageData", "KeyboardEvent", "MediaQueryList", "MessageEvent", "Navigator", "Response", "Storage", "WebSocket", "BinaryType", "Window"] }
wasm-bindgen-futures = { workspace = true }
serde-wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true }
gloo-timers = { version = "0.4", features = ["futures"] }
getrandom = { workspace = true, features = ["wasm_js"] }
