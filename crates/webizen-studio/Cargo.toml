[package]
name = "webizen-studio"
version = "0.0.35"
edition = "2021"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.10", features = ["v4"] }
futures-util = "0.3.30"
base64 = "0.22.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }

# ── Native-only dependencies (webizen-desktop uses webizen-studio as a library) ─
# These give the native build access to the render pipeline types.
# dioxus is included with "router" only (not "desktop") to avoid wry conflicts.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus = { version = "=0.8.0-alpha.1", features = ["router"] }
qualia-core-db = { version = "0.0.35", path = "../qualia-core-db" }
webizen-render = { version = "0.0.35", path = "../webizen-render" }
qualia-client-core = { version = "0.0.35", path = "../qualia-client-core" }
tokio = { version = "1", features = ["full"] }
dirs-next = "2.0.0"

# ── WASM-only dependencies ────────────────────────────────────────────────────
[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "=0.8.0-alpha.1", features = ["router", "web"] }
uuid = { version = "1.10", features = ["v4", "js"] }
# Exact pin: must match installed wasm-bindgen-cli (see scripts/build_frontend.*).
# Mismatch surfaces as: failed to find `__wbindgen_externref_table_dealloc` (mac CI).
wasm-bindgen = "=0.2.125"
js-sys = "0.3"
web-sys = { version = "0.3.100", features = ["CanvasRenderingContext2d", "Clipboard", "Document", "Element", "EventSource", "History", "HtmlCanvasElement", "ImageData", "KeyboardEvent", "MediaQueryList", "MessageEvent", "Navigator", "Response", "Storage", "WebSocket", "BinaryType", "Window"] }
wasm-bindgen-futures = "0.4.42"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"
gloo-timers = { version = "0.4", features = ["futures"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
