[package]
name = "webizen-studio"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7.9", features = ["router", "web"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
wasm-bindgen = "0.2.123"
js-sys = "0.3"
web-sys = { version = "0.3.100", features = ["CanvasRenderingContext2d", "Document", "Element", "EventSource", "History", "HtmlCanvasElement", "ImageData", "MessageEvent", "Response", "Storage", "WebSocket", "BinaryType", "Window"] }
uuid = { version = "1.10", features = ["v4", "js"] }
futures-util = "0.3.30"
wasm-bindgen-futures = "0.4.75"
serde-wasm-bindgen = "0.6.5"

# Surfaces wasm panics with a readable message + stack in the browser console
# instead of an opaque `unreachable`. Only pulled into the wasm build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
gloo-timers = "0.3"

# qualia-core-db and webizen-render are only needed for the native (non-wasm32)
# build. The wasm32/web build (GitHub Pages demo) uses stub types instead.
# Both share a single wgpu 0.19 device, so they link one wgpu version (see
# webizen-render/Cargo.toml).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
qualia-core-db = { version = "0.0.17", path = "../qualia-core-db" }
webizen-render = { version = "0.0.15", path = "../webizen-render" }

