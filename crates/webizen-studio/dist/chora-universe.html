<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chora · Universe</title>
  <style>
    :root {
      --bg: #020617;
      --panel: rgba(15, 23, 42, 0.82);
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #818cf8;
      --ok: #34d399;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font: 13px/1.45 system-ui, Segoe UI, sans-serif;
      overflow: hidden;
    }
    #sky {
      position: absolute; inset: 0; width: 100%; height: 100%;
      display: block; cursor: grab;
    }
    #sky:active { cursor: grabbing; }
    #hud {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; gap: 0.75rem; align-items: flex-start;
      padding: 0.85rem 1rem; pointer-events: none;
    }
    #hud > * { pointer-events: auto; }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.75rem 0.9rem;
      backdrop-filter: blur(10px); max-width: 22rem;
    }
    h1 {
      margin: 0 0 0.25rem; font-size: 1rem; font-weight: 650;
      letter-spacing: -0.02em; color: #fff;
    }
    h1 span { font-weight: 400; color: var(--muted); }
    p { margin: 0; color: var(--muted); font-size: 0.78rem; line-height: 1.45; }
    #worlds {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 0.75rem 1rem 1rem;
      background: linear-gradient(transparent, rgba(2, 6, 23, 0.95) 40%);
      display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: flex-end;
    }
    .world-chip {
      background: #0f172a; border: 1px solid #334155; color: var(--text);
      border-radius: 999px; padding: 0.4rem 0.75rem; cursor: pointer;
      font-size: 0.75rem; font-weight: 600;
    }
    .world-chip:hover, .world-chip.active {
      border-color: var(--accent); color: #c7d2fe;
      background: rgba(99, 102, 241, 0.15);
    }
    #status {
      position: absolute; top: 0.85rem; right: 1rem;
      max-width: 16rem; text-align: right;
      font-size: 0.72rem; color: var(--muted);
    }
    #status.err { color: #fca5a5; }
    button.action {
      margin-top: 0.55rem; background: #1e293b; color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0.35rem 0.65rem; cursor: pointer; font-weight: 600; font-size: 0.75rem;
    }
    button.action:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <canvas id="sky" aria-label="Chora starfield universe"></canvas>
  <div id="hud">
    <div class="card">
      <h1>Chora <span>· Universe</span></h1>
      <p id="blurb">
        Spatio-temporal commons canvas. Stars from the Chora starfield catalog;
        worlds are curated configurations (flagships), not engine forks.
        Drag to orbit · scroll to zoom.
      </p>
      <button type="button" class="action" id="btn-seed">Seed flagship worlds</button>
      <button type="button" class="action" id="btn-chora">Open Chora explorer</button>
    </div>
  </div>
  <div id="status">Loading worlds…</div>
  <div id="worlds"></div>
  <script>
    // Bright-star sample aligned with chora/layers/starfield.rs (subset for App page).
    const STARS = [
      [101.287, -16.716, -1.46, 0.0],   // Sirius
      [95.676, -52.696, -0.01, 0.71],  // Canopus
      [213.915, 19.182, 0.03, -0.01],  // Arcturus
      [279.234, 38.784, 0.08, 0.42],   // Vega
      [79.172, -45.999, 0.13, -0.16],
      [219.484, -60.834, 0.61, 1.23],
      [116.109, 28.072, 0.77, 0.42],
      [178.457, -1.943, 0.85, -0.23],
      [297.696, 8.868, 0.97, 1.63],
      [68.980, 16.510, 0.85, 0.42],    // Aldebaran
      [151.830, 16.399, 1.35, 0.42],   // Regulus
      [165.932, 61.751, 1.79, 1.07],   // Polaris
      [246.969, -26.432, 1.33, 1.59],  // Antares
      [312.497, -7.789, 1.74, 0.09],
      [299.085, 29.580, 1.81, 0.42],   // Deneb
      [37.954, 89.264, 1.98, 0.60],
      [80.627, -1.943, 1.84, 0.42],
      [104.656, -27.935, 1.80, 0.42],
      [200.981, -54.058, 1.09, 0.09],
      [283.816, -37.104, 1.50, 0.42],
    ];

    function bvToRgb(bv) {
      bv = Math.max(-0.4, Math.min(2.0, bv));
      const t = (bv + 0.4) / 2.4;
      const r = 1.0 - Math.min(t * 0.3, 0.5);
      const g = 1.0 - Math.abs(t * 0.5);
      const b = 1.0 - Math.min((1.0 - t) * 0.4, 0.5);
      const br = 1.0 - Math.abs(bv) * 0.1;
      return [r * br, g * br, b * br];
    }

    function raDecToXyz(raDeg, decDeg, radius) {
      const ra = raDeg * Math.PI / 180;
      const dec = decDeg * Math.PI / 180;
      return [
        radius * Math.cos(dec) * Math.cos(ra),
        radius * Math.sin(dec),
        radius * Math.cos(dec) * Math.sin(ra),
      ];
    }

    const canvas = document.getElementById("sky");
    const ctx = canvas.getContext("2d");
    let W = 0, H = 0, dpr = 1;
    let yaw = 0.4, pitch = -0.15, zoom = 1.0;
    let dragging = false, lx = 0, ly = 0;
    let activeWorld = "";
    let worlds = [];

    function resize() {
      dpr = window.devicePixelRatio || 1;
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function project(x, y, z) {
      // yaw around Y, pitch around X
      const cy = Math.cos(yaw), sy = Math.sin(yaw);
      const cp = Math.cos(pitch), sp = Math.sin(pitch);
      let x1 = x * cy + z * sy;
      let z1 = -x * sy + z * cy;
      let y1 = y * cp - z1 * sp;
      z1 = y * sp + z1 * cp;
      const f = 420 * zoom / Math.max(0.2, z1 + 3.2);
      return [W / 2 + x1 * f, H / 2 - y1 * f, z1];
    }

    function draw() {
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, W, H);
      // nebula wash
      const g = ctx.createRadialGradient(W * 0.35, H * 0.3, 20, W * 0.4, H * 0.35, W * 0.55);
      g.addColorStop(0, "rgba(99,102,241,0.12)");
      g.addColorStop(0.5, "rgba(56,189,248,0.05)");
      g.addColorStop(1, "rgba(2,6,23,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // faint field stars
      for (let i = 0; i < 280; i++) {
        const a = (i * 12.9898) % (Math.PI * 2);
        const b = (i * 78.233) % Math.PI - Math.PI / 2;
        const r = 1.6 + (i % 7) * 0.05;
        const [x, y, z] = raDecToXyz(a * 180 / Math.PI, b * 180 / Math.PI, r);
        const [px, py, depth] = project(x, y, z);
        if (depth < -1.5) continue;
        const s = 0.4 + (i % 3) * 0.25;
        ctx.fillStyle = `rgba(226,232,240,${0.15 + (i % 5) * 0.05})`;
        ctx.beginPath();
        ctx.arc(px, py, s, 0, Math.PI * 2);
        ctx.fill();
      }

      // catalog stars
      for (const [ra, dec, mag, bv] of STARS) {
        const size = Math.max(0.6, (6.5 - mag) / 6.5 * 3.2) * zoom;
        const [x, y, z] = raDecToXyz(ra, dec, 1.8);
        const [px, py, depth] = project(x, y, z);
        if (depth < -1.5) continue;
        const [r, g, b] = bvToRgb(bv);
        const alpha = Math.min(1, 0.55 + size * 0.12);
        ctx.fillStyle = `rgba(${Math.floor(r*255)},${Math.floor(g*255)},${Math.floor(b*255)},${alpha})`;
        ctx.beginPath();
        ctx.arc(px, py, size, 0, Math.PI * 2);
        ctx.fill();
        if (mag < 0.5) {
          ctx.strokeStyle = `rgba(${Math.floor(r*255)},${Math.floor(g*255)},${Math.floor(b*255)},0.25)`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(px, py, size * 2.2, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      // origin marker (Sydney / active world origin metaphor)
      const [ox, oy, od] = project(0, 0, 0.15);
      if (od > -1) {
        ctx.strokeStyle = "rgba(52,211,153,0.7)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(ox, oy, 8 * zoom, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "rgba(52,211,153,0.9)";
        ctx.font = "600 11px system-ui";
        ctx.fillText(activeWorld || "origin", ox + 12, oy + 4);
      }

      requestAnimationFrame(draw);
    }

    canvas.addEventListener("mousedown", (e) => {
      dragging = true; lx = e.clientX; ly = e.clientY;
    });
    window.addEventListener("mouseup", () => { dragging = false; });
    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      yaw += (e.clientX - lx) * 0.005;
      pitch = Math.max(-1.2, Math.min(1.2, pitch + (e.clientY - ly) * 0.004));
      lx = e.clientX; ly = e.clientY;
    });
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      zoom = Math.max(0.45, Math.min(2.8, zoom * (e.deltaY > 0 ? 0.92 : 1.08)));
    }, { passive: false });

    async function invoke(cmd, args = {}) {
      if (!window.__TAURI__ || !window.__TAURI__.core) {
        throw new Error("Not inside Tauri host — starfield still runs offline");
      }
      return window.__TAURI__.core.invoke(cmd, args);
    }

    function setStatus(msg, err) {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.className = err ? "err" : "";
    }

    function renderWorlds() {
      const host = document.getElementById("worlds");
      host.innerHTML = "";
      if (!worlds.length) {
        const empty = document.createElement("span");
        empty.style.cssText = "color:#64748b;font-size:0.78rem;";
        empty.textContent = "No worlds yet — seed flagships above.";
        host.appendChild(empty);
        return;
      }
      for (const w of worlds) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "world-chip" + (w.id === activeWorld ? " active" : "");
        btn.textContent = (w.title || w.id) + (w.layerCount != null ? ` · ${w.layerCount}L` : "");
        btn.title = w.id || "";
        btn.onclick = async () => {
          try {
            await invoke("chora_set_active_world", { worldId: w.id });
            activeWorld = w.id;
            renderWorlds();
            setStatus("Active world: " + (w.title || w.id));
          } catch (e) {
            setStatus(String(e), true);
          }
        };
        host.appendChild(btn);
      }
    }

    async function refreshWorlds() {
      try {
        const raw = await invoke("chora_list_worlds");
        const list = typeof raw === "string" ? JSON.parse(raw) : raw;
        worlds = Array.isArray(list) ? list : [];
        try {
          const navRaw = await invoke("chora_navigation");
          const nav = typeof navRaw === "string" ? JSON.parse(navRaw) : navRaw;
          activeWorld = (nav && nav.activeWorldId) || "";
        } catch (_) {}
        setStatus(worlds.length
          ? `${worlds.length} world(s) · drag sky to orbit`
          : "Starfield ready · seed flagships to load worlds");
        renderWorlds();
      } catch (e) {
        setStatus("Offline starfield (host APIs unavailable): " + e, true);
        renderWorlds();
      }
    }

    document.getElementById("btn-seed").onclick = async () => {
      setStatus("Seeding…");
      try {
        // Prefer flagships; fall back to demo.
        try {
          const n = await invoke("chora_seed_flagships");
          setStatus("Flagships seeded: " + n);
        } catch (_) {
          const ok = await invoke("chora_seed_demo");
          setStatus(ok ? "Demo world seeded" : "Worlds already present");
        }
        await refreshWorlds();
      } catch (e) {
        setStatus(String(e), true);
      }
    };

    document.getElementById("btn-chora").onclick = async () => {
      try {
        // Open main shell Chora route via shell action if available.
        await invoke("open_web_url", { url: "qualia://chora" });
      } catch (_) {
        try {
          await invoke("browser_navigate", { url: "qualia://chora" });
        } catch (e) {
          setStatus("Open Chora tab from the shell menu (Ctrl+2). " + e, true);
        }
      }
    };

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(draw);
    refreshWorlds();
  </script>
</body>
</html>
