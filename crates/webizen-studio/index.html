<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webizen</title>
  <!-- CSS needed for the loading screen -->
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #boot-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #09090b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(6, 182, 212, 0.2);
      border-top-color: #06b6d4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    .logo {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .logo span.hexagon {
      color: #06b6d4;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #a1a1aa;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #main {
      display: contents;
    }
    .boot-error {
      max-width: 520px;
      text-align: center;
      padding: 0 1.5rem;
    }
    .boot-error h2 { color: #f87171; margin: 0 0 0.5rem; font-size: 1.1rem; }
    .boot-error p { color: #a1a1aa; font-size: 0.85rem; line-height: 1.5; margin: 0.25rem 0; }
    .boot-error code { color: #06b6d4; }
  </style>
</head>
<body>
  <div id="main"></div>

  <!-- Boot loader lives OUTSIDE #main. Dioxus mounts the app INTO #main (it
       appends its root node rather than clearing the element), so the loader is
       removed explicitly once the app node appears — otherwise it lingered as a
       banner above the app. -->
  <div id="boot-loader">
    <div class="spinner"></div>
    <div class="logo"><span class="hexagon">⬡</span> Webizen</div>
    <div class="subtitle">Human-Centric Internet Initiating...</div>
  </div>

  <script>
    (function () {
      var BOOT_TIMEOUT_MS = 12000;
      var bootStart = Date.now();
      var main = document.getElementById('main');

      function appMounted() {
        // Dioxus mounts its root as a child of #main.
        return main && main.children.length > 0;
      }
      function removeLoader() {
        var l = document.getElementById('boot-loader');
        if (l) l.remove();
      }

      // Remove the loader the moment the app mounts into #main.
      var obs = new MutationObserver(function () {
        if (appMounted()) { removeLoader(); obs.disconnect(); }
      });
      if (main) obs.observe(main, { childList: true, subtree: true });

      // Handle the race where the app mounted before this script ran.
      if (appMounted()) { removeLoader(); obs.disconnect(); }

      // If nothing mounted after the timeout, the runtime likely panicked.
      setTimeout(function () {
        if (!appMounted()) {
          obs.disconnect();
          var l = document.getElementById('boot-loader');
          if (l) {
            l.innerHTML =
              '<div class="boot-error">' +
              '<h2>Webizen failed to start</h2>' +
              '<p>The application did not finish loading after ' +
              Math.round((Date.now() - bootStart) / 1000) + 's.</p>' +
              '<p>Open the browser console (<code>F12</code>) for the panic message. ' +
              'A hard refresh (<code>Ctrl/Cmd + Shift + R</code>) often helps if a stale ' +
              'build is cached.</p>' +
              '</div>';
          }
        }
      }, BOOT_TIMEOUT_MS);
    })();
  </script>
</body>
</html>
