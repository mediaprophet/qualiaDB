[package]
name = "qualia-vision"
version = "0.0.40"
edition = "2021"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
description = "Native visual intelligence for QualiaDB — detection/classify ABI, epistemic observations, Phase-1 CPU reference"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["cpu-reference"]
cpu-reference = []
# Future: wire shared wgpu + forge for detector backends.
gpu = []
codecs = ["dep:image"]
ort = ["dep:ort", "qualia-core-db/vision-onnx"]

[dependencies]
# Pure kernels live in specialized_libs::computer_vision (MIG-V2).
qualia-core-db = { workspace = true, default-features = true }
# Optional cold-path decode only (not hot-path).
image = { workspace = true, optional = true, default-features = false, features = ["png", "jpeg"] }
ort = { workspace = true, optional = true }

[dev-dependencies]
