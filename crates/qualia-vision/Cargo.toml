[package]
name = "qualia-vision"
version = "0.0.24"
edition = "2021"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
description = "Native visual intelligence for QualiaDB — detection/classify ABI, epistemic observations, Phase-1 CPU reference"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["cpu-reference"]
cpu-reference = []
# Future: wire shared wgpu + forge for detector backends.
gpu = []
codecs = ["dep:image"]

[dependencies]
# Optional cold-path decode only (not hot-path).
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
