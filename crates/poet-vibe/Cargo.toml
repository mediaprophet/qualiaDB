[package]
name = "poet-vibe"
version = "0.0.31"
edition = "2021"
description = "Poet engine: VibeScript 0.1 lexer, parser, type/effect checker, and AST interpreter. No JIT. No wgpu."
license-file = "LICENSE"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
repository = "https://github.com/mediaprophet/qualiaDB"

[lib]
name = "poet_vibe"
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }

[dev-dependencies]
