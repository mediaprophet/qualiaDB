[package]
name = "webizen-lite-wasm"
version = "0.0.30"
edition = "2021"
description = "Ontology-site MCP JSON-RPC endpoint backed by Qualia's WASM-safe reasoning kernel."
license-file = "LICENSE"
repository = "https://github.com/mediaprophet/qualiaDB"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
# Technical work: CC BY-NC-ND 4.0 (Attribution-NonCommercial-NoDerivatives).
# Aligns with the Webizen / ns.webcivics.net technical-work rights scope.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The published binary gets only the ontology kernel.
qualia-core-db = { path = "../qualia-core-db", default-features = false, features = ["wasm-ontology"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native unit tests use normal engine defaults while selecting the same profile label.
qualia-core-db = { path = "../qualia-core-db", features = ["wasm-ontology"] }
