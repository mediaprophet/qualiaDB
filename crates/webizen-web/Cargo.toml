[package]
name = "qualia-wasm"
version = "0.0.39"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlButtonElement",
    "Node",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Window",
    "Performance",
    "Navigator",
    "CanvasGradient",
] }
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

# Now that QualiaDB (C:\Projects\qualiaDB) is fully functional and full-featured,
# we depend on it for the real .q42 / 10D tensor / ontology engine in WASM.
# This makes webizen-web the single combined package (Qualia core + our web graphics glue).
[target.'cfg(target_arch = "wasm32")'.dependencies]
qualia-core-db = { path = "../qualia-core-db", default-features = false, features = ["wasm-full"] }

# Re-export some core WASM symbols from Qualia so the single package exposes them cleanly
# (the final webizen-web.wasm will contain both the qualia engine + our web graphics glue)

# Graphics layer: minimal canvas2d path for now (see render_stub.rs).
# Future: depend on webizen-render with a "web" feature for shared scene contracts + WebGPU path.

[features]
default = []
