[package]
name = "webizen-render"
version = "0.0.28"
edition = "2021"
publish = false

[dependencies]
# Must match qualia-core-db: native rendering and inference share one physical device.
wgpu = "30"
bytemuck = { version = "1.14", features = ["derive"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }

[dependencies.qualia-core-db]
path = "../qualia-core-db"
optional = true

# Offscreen frame delivery is native-only: the wasm/web build renders to a <canvas>
# via WebGPU/WebGL instead of reading pixels back. png codec only, to keep the
# dependency lean (image@0.25 is already in the workspace lock).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
pollster = "1"

[features]
default = ["qualia"]
qualia = ["qualia-core-db"]

[build-dependencies]
cfg_aliases = "0.2"

[dev-dependencies]
serde_json = "1"
