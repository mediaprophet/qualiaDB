[package]
name = "wellfare-core"
version = "0.0.39"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
csv = { workspace = true }
serde = { workspace = true, features = ["derive"] }
chrono = { workspace = true, default-features = true, features = ["serde"] }
serde_json = { workspace = true }
sha2 = { workspace = true, default-features = true }
hex = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde", "js"] }
# oxigraph: in-memory RDF store + SPARQL 1.1 engine (W4/W5)
# js feature: uses js-sys for random/time in WASM; compiles natively without it
oxigraph = { version = "0.5", default-features = false, features = ["js"] }
# vibe: InstantBridge / SpatialAnchorLite conversions (feature `qualia`)
vibe = { workspace = true, optional = true }

[features]
# Instant/Duration/SpatialAnchor bridges into vibe. Do NOT pull qualia-core-db —
# that creates a Cargo cycle once core-db binds qualia-cooperative-core
# (cooperative-core → wellfare-core → core-db).
qualia = ["vibe"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
