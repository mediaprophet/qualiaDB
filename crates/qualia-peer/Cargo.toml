[package]
name = "qualia-peer"
version = "0.0.37"
edition = "2021"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
description = "Qualia Peer Runtime facade over the native QDNF stack (no libp2p)"
license-file = "../../LICENSE"

[dependencies]
# Native Independent slice: `qdnf` only. No libp2p-compat, gpu-runtime, wgsl-forge,
# privacy-he, zk-culling, or profile_target_1024. Default core-db still has those.
qualia-core-db = { path = "../qualia-core-db", default-features = false, features = ["qdnf"] }

[[example]]
name = "native_ipc_peers"
path = "examples/native_ipc_peers.rs"
