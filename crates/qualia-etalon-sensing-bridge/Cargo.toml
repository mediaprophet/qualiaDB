[package]
name = "qualia-etalon-sensing-bridge"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../../LICENSE"

# Standalone integration using the canonical sibling Etalon checkout.
[workspace]
resolver = "2"

[dependencies]
qualia-core-db = { path = "../qualia-core-db", default-features = false }
etalon-sense-core = { git = "https://github.com/mediaprophet/etalon.git", rev = "d4a6af1ad689c82696a07d68fb9999e8f301170d" }
etalon-sense-nfc = { git = "https://github.com/mediaprophet/etalon.git", rev = "d4a6af1ad689c82696a07d68fb9999e8f301170d" }
ed25519-dalek = { version = "3.0", default-features = false }

[dev-dependencies]
etalon-sense-sdr = { git = "https://github.com/mediaprophet/etalon.git", rev = "d4a6af1ad689c82696a07d68fb9999e8f301170d" }
ed25519-dalek = { version = "3.0", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"

[patch.crates-io]
imap-proto = { path = "../../vendor/imap-proto" }

[patch."https://github.com/mediaprophet/vibe-script.git"]
vibescript-abi = { path = "../../crates/vibescript-abi" }
