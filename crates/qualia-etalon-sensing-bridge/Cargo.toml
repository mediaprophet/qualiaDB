[package]
name = "qualia-etalon-sensing-bridge"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../../LICENSE"

# Standalone integration using the canonical sibling Etalon checkout.
[workspace]
resolver = "2"

[dependencies]
qualia-core-db = { path = "../qualia-core-db", default-features = false }
etalon-sense-core = { git = "https://github.com/mediaprophet/etalon.git", rev = "6ace6cc6413a87ca10a1da58397ddc7c0b2fc41e" }
etalon-sense-nfc = { git = "https://github.com/mediaprophet/etalon.git", rev = "6ace6cc6413a87ca10a1da58397ddc7c0b2fc41e" }
ed25519-dalek = { version = "3.0", default-features = false }

[dev-dependencies]
etalon-sense-sdr = { git = "https://github.com/mediaprophet/etalon.git", rev = "6ace6cc6413a87ca10a1da58397ddc7c0b2fc41e" }
ed25519-dalek = { version = "3.0", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"

[patch.crates-io]
imap-proto = { path = "../../vendor/imap-proto" }

[patch."https://github.com/mediaprophet/vibe-script.git"]
vibescript-abi = { path = "../../crates/vibescript-abi" }

[patch."https://github.com/mediaprophet/etalon.git"]
naga = { path = "../../../etalon/naga" }
etalon = { path = "../../../etalon/etalon" }
etalon-diagnostics = { path = "../../../etalon/crates/etalon-diagnostics" }
etalon-agent = { path = "../../../etalon/crates/etalon-agent" }
etalon-wgsl-forge = { path = "../../../etalon/crates/etalon-wgsl-forge" }
etalon-nquin = { path = "../../../etalon/crates/etalon-nquin" }
etalon-tensor = { path = "../../../etalon/crates/etalon-tensor" }
etalon-render = { path = "../../../etalon/crates/etalon-render" }
etalon-sim = { path = "../../../etalon/crates/etalon-sim" }
etalon-signal = { path = "../../../etalon/crates/etalon-signal" }
etalon-wasm = { path = "../../../etalon/crates/etalon-wasm" }
etalon-resources = { path = "../../../etalon/crates/etalon-resources" }
etalon-model-io = { path = "../../../etalon/crates/etalon-model-io" }
etalon-model = { path = "../../vendor/etalon-model-6ace6cc" }
etalon-sense-core = { path = "../../../etalon/crates/etalon-sense-core" }
etalon-sense-nfc = { path = "../../../etalon/crates/etalon-sense-nfc" }
etalon-sense-sdr = { path = "../../../etalon/crates/etalon-sense-sdr" }
