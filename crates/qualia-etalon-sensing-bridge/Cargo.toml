[package]
name = "qualia-etalon-sensing-bridge"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../../LICENSE"

# Standalone integration using the canonical sibling Etalon checkout.
[workspace]

[dependencies]
qualia-core-db = { path = "../qualia-core-db", default-features = false }
etalon-sense-core = { git = "https://github.com/mediaprophet/etalon.git", rev = "2f52a55c6bea1e9923099ba95730f201bc9b3af4" }
etalon-sense-nfc = { git = "https://github.com/mediaprophet/etalon.git", rev = "2f52a55c6bea1e9923099ba95730f201bc9b3af4" }
ed25519-dalek = { version = "3.0", default-features = false }

[dev-dependencies]
ed25519-dalek = { version = "3.0", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
