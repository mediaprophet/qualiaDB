[package]
name = "poet"
version = "0.0.39"
edition = "2021"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
license = "CC-BY-NC-ND-4.0"
description = "Poet HyperCanvas — Spatial Hypermedia Workspace & Living Document Environment"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "poet-ui"
path = "src/main.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ciborium = { workspace = true }
uuid = { workspace = true, features = ["v4", "js"] }
chrono = { workspace = true, default-features = true, features = ["wasmbind"] }
console_error_panic_hook = { workspace = true }
base64 = { workspace = true, default-features = true }
serde-wasm-bindgen = { workspace = true }
vibe = { workspace = true }

# WASM / browser
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlMediaElement",
    "Blob",
    "Url",
    "Window",
    "console",
    "Node",
    "Text",
    "DocumentFragment",
    "DomTokenList",
    "Event",
    "EventTarget",
    "AddEventListenerOptions",
    "PointerEvent",
    "CustomEvent",
    "HtmlDocument",
    "HtmlDivElement",
    "HtmlButtonElement",
    "HtmlInputElement",
    "File",
    "FileList",
    "FileReader",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "HtmlHeadElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "NodeList",
    "CssStyleDeclaration",
    "MouseEvent",
    "WheelEvent",
    "KeyboardEvent",
    "InputEvent",
    "DragEvent",
    "ClipboardEvent",
    "DataTransfer",
    "Storage",
    "Location",
    "Performance",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "SvgElement",
    "HtmlAnchorElement",
    "DomRect",
    "Selection",
    "Range",
    "EventSource",
    "AbortController",
    "AbortSignal",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
