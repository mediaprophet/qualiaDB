[package]
name = "etalon-model"
version = "0.0.2"
edition = "2021"
rust-version = "1.95"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
repository = "https://github.com/mediaprophet/etalon"
license = "CC-BY-NC-ND-4.0"
publish = false
description = "Borrowed model container layouts and explicit integrity validation"

# Isolate the unchanged pinned package from the enclosing Qualia workspace.
[workspace]
resolver = "3"

[features]
default = []
# Preserves the original codec float operations; requires std on native and WASM.
inference-model = ["ggml", "dep:serde", "dep:etalon-inference-kernel"]
gguf-index = ["inference-model"]
ggml = ["dep:half", "dep:bytemuck"]

[dependencies]
serde = { version = "1.0.229", default-features = false, optional = true, features = ["derive", "alloc"] }
# Preserve the exact canonical kernel identity used by Qualia's existing facade.
etalon-inference-kernel = { version = "0.0.2", git = "https://github.com/mediaprophet/etalon.git", rev = "6ace6cc6413a87ca10a1da58397ddc7c0b2fc41e", optional = true }
half = { version = "2.7.1", default-features = false, optional = true }
bytemuck = { version = "1.25.2", optional = true, features = ["extern_crate_alloc", "min_const_generics", "derive"] }

[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
ref_as_ptr = "warn"

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1.0.154"
