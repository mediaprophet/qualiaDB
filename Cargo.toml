[workspace]
members = [
    "crates/qualia-inference-kernel",
    "crates/qualia-core-db",
    "crates/poet-vibe",
    "crates/qualia-cli",
    "crates/qualia-solid-bridge",
    "crates/qualia-client-core",
    "crates/qualia-extensions",
    "crates/webizen-component-harvester",
    "crates/webizen-render",
    "crates/webizen-studio",
    "crates/webizen-runtime",
    "crates/webizen-desktop",
    "crates/webizen-web",
    "crates/qualia-mobile-harness",
    "crates/wellfare-core",
    "crates/qualia-cooperative-core",
    "crates/qualia-semantic-library",
    "crates/webizen-lite-wasm",
    "crates/qualia-q-forge",
    "crates/qualia-vision",
    "crates/qualia-audio",
    "crates/poet-cli",
    "crates/poet-lsp",
    "crates/vibe-wasm",
]
resolver = "2"

# Profile for WASM web builds (qualia-mobile-harness).
# wasm-opt on Windows crashes with STATUS_STACK_BUFFER_OVERRUN when the AST is
# too large for its default 1 MB thread stack. Feeding it a smaller, LTO-pruned
# binary prevents the overflow entirely. This profile must live at workspace root
# because Cargo silently ignores [profile.*] in non-root crate Cargo.toml files.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"

# Vendored imap-proto 0.10.2 with the trailing-semicolon-in-macro future-incompat lint fixed
# (upstream imap 2.4.1 pins imap-proto ^0.10.0; the fix hasn't been published to crates.io for
# the 0.10.x line, so we vendor + patch locally). Remove when imap publishes a 0.10.x fix or when
# we upgrade to imap 3.x (which uses the imap-types ecosystem instead).
[patch.crates-io]
imap-proto = { path = "vendor/imap-proto" }
