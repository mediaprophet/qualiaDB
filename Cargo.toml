webizen-render = { path = "crates/webizen-render" }
webizen-studio = { path = "crates/webizen-studio" }
webizen-runtime = { path = "crates/webizen-runtime" }
webizen-desktop = { path = "crates/webizen-desktop" }
qualia-wasm = { path = "crates/webizen-web" }
qualia-mobile-harness = { path = "crates/qualia-mobile-harness" }
wellfare-core = { path = "crates/wellfare-core" }
qualia-cooperative-core = { path = "crates/qualia-cooperative-core" }
qualia-semantic-library = { path = "crates/qualia-semantic-library" }
