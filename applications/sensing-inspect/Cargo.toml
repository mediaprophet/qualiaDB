[package]
name = "qualia-sensing-inspect"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../../LICENSE"

[package.metadata.qualia]
distribution = "distribution.json"
packaging_script = "package.ps1"
qualification = "source-only; unbuilt and untested"

# Deliberately outside the production workspace dependency graph.
[workspace]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
ed25519-dalek = { version = "3.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
qualia-core-db = { path = "../../crates/qualia-core-db", default-features = false }
qualia-etalon-sensing-bridge = { path = "../../crates/qualia-etalon-sensing-bridge" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
