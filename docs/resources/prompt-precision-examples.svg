<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Three examples of prompt precision</title>
  <desc id="desc">Community planning, small organisation policy drafting and technical incident review all follow the pattern purpose, bounded assistance and human check.</desc>
  <rect width="1200" height="380" rx="28" fill="#101827"/>
  <g font-family="Inter,Arial,sans-serif"><text x="52" y="58" fill="#e2e8f0" font-size="28" font-weight="700">The same pattern applies across different kinds of work</text><text x="52" y="88" fill="#94a3b8" font-size="17">Define the purpose, bound the assistance, then keep the final check with people.</text></g>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(52 130)"><rect width="340" height="202" rx="20" fill="#172554" stroke="#60a5fa"/><text x="26" y="44" fill="#dbeafe" font-size="21" font-weight="700">Community planning</text><text x="26" y="78" fill="#bfdbfe" font-size="16" font-weight="700">Purpose</text><text x="26" y="100" fill="#bfdbfe" font-size="15">Compare supplied options fairly.</text><text x="26" y="132" fill="#bfdbfe" font-size="16" font-weight="700">AI assistance</text><text x="26" y="154" fill="#bfdbfe" font-size="15">Summarise plans; flag uncertainty.</text><text x="26" y="186" fill="#bfdbfe" font-size="16" font-weight="700">Human check</text></g>
    <g transform="translate(430 130)"><rect width="340" height="202" rx="20" fill="#12303a" stroke="#2dd4bf"/><text x="26" y="44" fill="#ccfbf1" font-size="21" font-weight="700">Organisation policy</text><text x="26" y="78" fill="#99f6e4" font-size="16" font-weight="700">Purpose</text><text x="26" y="100" fill="#99f6e4" font-size="15">Prepare a controlled first draft.</text><text x="26" y="132" fill="#99f6e4" font-size="16" font-weight="700">AI assistance</text><text x="26" y="154" fill="#99f6e4" font-size="15">Use approved local material only.</text><text x="26" y="186" fill="#99f6e4" font-size="16" font-weight="700">Human check</text></g>
    <g transform="translate(808 130)"><rect width="340" height="202" rx="20" fill="#312e5f" stroke="#a78bfa"/><text x="26" y="44" fill="#ede9fe" font-size="21" font-weight="700">Incident review</text><text x="26" y="78" fill="#ddd6fe" font-size="16" font-weight="700">Purpose</text><text x="26" y="100" fill="#ddd6fe" font-size="15">Create a reviewable timeline.</text><text x="26" y="132" fill="#ddd6fe" font-size="16" font-weight="700">AI assistance</text><text x="26" y="154" fill="#ddd6fe" font-size="15">Separate facts from hypotheses.</text><text x="26" y="186" fill="#ddd6fe" font-size="16" font-weight="700">Human check</text></g>
  </g>
</svg>
