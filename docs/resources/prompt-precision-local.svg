<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">A local AI workflow on an affordable personal computer</title>
  <desc id="desc">A person uses a personal computer with system memory, an optional graphics card and a local model. The workflow retains bounded resources, a human review step and no dependence on a data centre.</desc>
  <rect width="1200" height="360" rx="28" fill="#0f172a"/>
  <g font-family="Inter,Arial,sans-serif"><text x="52" y="58" fill="#e2e8f0" font-size="28" font-weight="700">Local AI: useful work on affordable personal computers</text><text x="52" y="88" fill="#94a3b8" font-size="17">A modest graphics card can help, but it is not the definition of access; CPU-only routes matter too.</text></g>
  <g transform="translate(70 130)" font-family="Inter,Arial,sans-serif"><rect width="440" height="175" rx="20" fill="#111f34" stroke="#38bdf8" stroke-width="2"/><rect x="34" y="35" width="230" height="105" rx="10" fill="#0b1220" stroke="#64748b"/><rect x="51" y="51" width="196" height="71" rx="5" fill="#12303a"/><path d="M119 151h61m-31 0v19m-59 0h120" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/><text x="286" y="65" fill="#e0f2fe" font-size="19" font-weight="700">Personal computer</text><text x="286" y="95" fill="#bae6fd" font-size="15">System memory</text><text x="286" y="119" fill="#bae6fd" font-size="15">Optional GPU</text><text x="286" y="143" fill="#bae6fd" font-size="15">CPU-only fallback</text></g>
  <path d="M530 216h88" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#67e8f9"/></marker></defs>
  <g transform="translate(638 130)" font-family="Inter,Arial,sans-serif"><rect width="220" height="175" rx="20" fill="#312e5f" stroke="#a78bfa" stroke-width="2"/><text x="110" y="57" text-anchor="middle" fill="#ede9fe" font-size="21" font-weight="700">Local model</text><text x="110" y="90" text-anchor="middle" fill="#ddd6fe" font-size="15">Bounded memory</text><text x="110" y="114" text-anchor="middle" fill="#ddd6fe" font-size="15">Chosen evidence</text><text x="110" y="138" text-anchor="middle" fill="#ddd6fe" font-size="15">Measured conditions</text></g>
  <path d="M878 216h88" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(986 130)" font-family="Inter,Arial,sans-serif"><rect width="160" height="175" rx="20" fill="#3a2716" stroke="#fbbf24" stroke-width="2"/><text x="80" y="57" text-anchor="middle" fill="#fef3c7" font-size="21" font-weight="700">Person</text><text x="80" y="91" text-anchor="middle" fill="#fde68a" font-size="15">Reviews</text><text x="80" y="115" text-anchor="middle" fill="#fde68a" font-size="15">Decides</text><text x="80" y="139" text-anchor="middle" fill="#fde68a" font-size="15">Corrects</text></g>
</svg>
