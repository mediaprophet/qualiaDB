theme: jekyll-theme-slate
title: Webizen / QualiaDB
description: Local-first life-domain habitat on the zero-allocation QualiaDB semantic engine — Memory, Relations, Care, Practice, World, Instruments.
baseurl: "/qualiaDB"

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: qualia

# Pass binary dataset and WASM artefacts through unchanged.
include:
  - menu.json
  - css/*.css
  - _layouts
  - "*.q42"
  - "*.lex"
  - "*.wasm"
  - "playground/*.html"
  - "playground/*.js"
  - "playground/*.wasm"
  - "playground/*.json"
  - "playground/*.css"
  - "playground/wordnet.q42"
  - "data/**/*.q42"
  - "data/**/*.c.q42"
  - "data/**/*.nt"
  - "data/**/*.lex"
  - "data/**/*.bidx"
  - "js/*.js"
  - "pkg/**/*.js"
  - "pkg/**/*.wasm"
  - "pkg/**/package.json"
  - "resources/*.json"
  - "tests/**/*.js"

# Exclude large local-only WordNet sidecars (unified v2 .q42 embeds lex+bidx).
exclude:
  - "playground/wordnet.c.q42"
  - "playground/wordnet.q42.lex"
  - "playground/wordnet.q42.lex.lz4"
  - "playground/wordnet.q42.bidx"
