  <div class="dd-layout">
    <button type="button" class="dd-mobile-toggle" id="dd-mobile-toggle">Modules</button>
    <nav class="dd-sidebar">
      <input type="text" class="dd-search" id="dd-search" placeholder="Search items, signatures…" />
      <input type="hidden" id="search" value="" />
      <div id="catBar" class="dd-cat-bar" aria-label="Module categories"></div>
      <div id="dd-module-list"></div>
    </nav>
    <div class="dd-content-wrap" id="detail">
      <div id="dd-intro" class="dd-intro"></div>
      <div class="dd-content" id="dd-content">
        <div class="dd-loading">Loading dev docs…</div>
      </div>
    </div>
  </div>
</div>

<script>
  let allModules = [];
  let currentModule = null;
  const API_INDEX_FALLBACK = 'vibescript_api_index.json';

  (async function() {
    try {
      // Same-directory fetch works on GitHub Pages (/vibe/dev-docs.html) and
      // a plain static server without Liquid preprocessing.
      let resp = await fetch(new URL('dev-docs.json', window.location.href));
      if (!resp.ok) {
        resp = await fetch(new URL(API_INDEX_FALLBACK, window.location.href));
      }
      allModules = await resp.json();

      allModules.sort((a, b) => {
        if (a.name === 'wasm') return -1;
        if (b.name === 'wasm') return 1;
        return a.name.localeCompare(b.name);
      });

      document.getElementById('dd-mobile-toggle')?.addEventListener('click', () => {
        document.querySelector('.vibe-devdocs')?.classList.toggle('dd-nav-open');
      });

      // Build category filter bar (#catBar)
      const catBar = document.getElementById('catBar');
      if (catBar) {
        ['all', 'wasm', 'check', 'cosmic', 'bind'].forEach((cat) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'dd-cat-chip' + (cat === 'all' ? ' active' : '');
          btn.textContent = cat;
          btn.addEventListener('click', () => {
            catBar.querySelectorAll('.dd-cat-chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            const q = cat === 'all' ? '' : cat;
            const searchEl = document.getElementById('dd-search');
            if (searchEl) {
              searchEl.value = q;
              searchEl.dispatchEvent(new Event('input'));
            }
          });
          catBar.appendChild(btn);
        });
      }

      // Build sidebar
      const sidebar = document.getElementById('dd-module-list');
      const list = document.createElement('ul');
      list.className = 'dd-module-list';
      let totalItems = 0;
      allModules.forEach((mod, i) => {
        totalItems += mod.items.length;
        const li = document.createElement('li');
        li.className = 'dd-module';
        li.dataset.idx = i;
        li.innerHTML = `${mod.name || '(root)'} <span class="count">${mod.items.length}</span>`;
        li.addEventListener('click', () => selectModule(i));
        list.appendChild(li);
      });
      sidebar.appendChild(list);

      // Search
      document.getElementById('dd-search').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        if (!query) {
          document.querySelectorAll('.dd-module').forEach(el => el.style.display = '');
          if (currentModule) renderModule(currentModule);
          return;
        }
        const results = [];
        const matchingModules = new Set();
        allModules.forEach((mod, mi) => {
          const moduleHit = (mod.name || '').toLowerCase().includes(query)
            || (mod.doc || '').toLowerCase().includes(query);
          if (moduleHit) matchingModules.add(mi);
          mod.items.forEach(item => {
            if (item.name.toLowerCase().includes(query) ||
                (item.doc || '').toLowerCase().includes(query) ||
                (item.kind || '').toLowerCase().includes(query) ||
                (item.signature || '').toLowerCase().includes(query) ||
                (item.file || '').toLowerCase().includes(query)) {
              results.push({ module: mod.name, mi, ...item });
              matchingModules.add(mi);
            }
          });
        });
        document.querySelectorAll('.dd-module').forEach((el, i) => {
          el.style.display = matchingModules.has(i) ? '' : 'none';
        });
        renderSearchResults(results);
      });

      const intro = document.getElementById('dd-intro');
      if (intro) {
        intro.innerHTML = `Generated from <code>crates/vibe/src</code> plus the browser ABI in <code>crates/vibe-wasm/src/lib.rs</code>
          (module <code>wasm</code>). Playground (<a href="playground.html" style="color:#22d3ee">playground.html</a>) <strong>Run</strong> is <code>eval_program_src</code>:
          LocalHost, workshop dialect, preamble then <code>effect fn main</code> when present.
          Host catalog lives under <code>bind::host</code> (<code>trait Host</code>) and <code>bind::local</code> (<code>LocalHost</code>);
          normative language semantics are in <a href="spec.html" style="color:#22d3ee">spec.html</a>.
          <div class="dd-stats">${allModules.length} modules · ${totalItems} public items</div>`;
      }

      if (allModules.length > 0) {
        const { idx, item } = moduleFromHash();
        selectModule(idx, item);
      }
    } catch (err) {
      document.getElementById('dd-content').innerHTML =
        `<p style="color:#f87171;">Failed to load dev docs: ${err.message}</p>`;
    }
  })();

  function moduleFromHash() {
    const raw = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    if (!raw) return { idx: 0, item: '' };
    const slash = raw.indexOf('/');
    const modName = slash === -1 ? raw : raw.slice(0, slash);
    const item = slash === -1 ? '' : raw.slice(slash + 1);
    const idx = allModules.findIndex((m) => m.name === modName);
    return { idx: idx >= 0 ? idx : 0, item };
  }

  function selectModule(idx, itemName) {
    currentModule = allModules[idx];
    document.querySelectorAll('.dd-module').forEach((el, i) => {
      el.classList.toggle('active', i === idx);
    });
    const hash = itemName
      ? `#${currentModule.name}/${itemName}`
      : `#${currentModule.name}`;
    if (location.hash !== hash) {
      history.replaceState(null, '', hash);
    }
    renderModule(currentModule, itemName);
  }

  function renderModule(mod, itemName) {
    const content = document.getElementById('dd-content');
    let html = `<div class="dd-module-header">
      <h2>${mod.name || '(root)'}</h2>
      ${mod.items[0]?.file ? `<div class="file">${escapeHtml(mod.items[0].file)}</div>` : ''}
    </div>`;

    if (mod.doc) {
      html += `<div class="dd-module-doc">${escapeHtml(mod.doc)}</div>`;
    }

    // Group items by kind
    const byKind = {};
    mod.items.forEach(item => {
      if (!byKind[item.kind]) byKind[item.kind] = [];
      byKind[item.kind].push(item);
    });

    const kindOrder = ['struct', 'enum', 'trait', 'fn', 'const', 'type', 'use', 'module', 'static'];

    kindOrder.forEach(kind => {
      if (byKind[kind]) {
        byKind[kind].forEach(item => {
          html += renderItem(item);
        });
      }
    });

    content.innerHTML = html;
    if (itemName) {
      const el = document.getElementById(itemDomId(itemName));
      if (el) el.scrollIntoView({ block: 'start' });
    }
  }

  function itemDomId(name) {
    return `dd-item-${encodeURIComponent(name)}`;
  }

  function renderItem(item) {
    let html = `<div class="dd-item" id="${itemDomId(item.name)}">
      <div class="dd-item-header">
        <span class="dd-item-kind dd-kind-${item.kind}">${item.kind}</span>
        <span class="dd-item-name">${escapeHtml(item.name)}</span>
      </div>`;
    if (item.signature) {
      html += `<div class="dd-item-sig">${escapeHtml(item.signature)}</div>`;
    }
    if (item.doc) {
      html += `<div class="dd-item-doc">${escapeHtml(item.doc)}</div>`;
    }
    html += `<div class="dd-item-loc">${item.file}:${item.line}</div>`;
    html += `</div>`;
    return html;
  }

  function renderSearchResults(results) {
    const content = document.getElementById('dd-content');
    if (results.length === 0) {
      content.innerHTML = `<p style="color:#64748b;">No results found.</p>`;
      return;
    }
    let html = `<div class="dd-stats">${results.length} results</div>`;
    results.forEach(r => {
      html += `<div class="dd-item" data-mi="${r.mi}" data-item="${escapeHtml(r.name)}" role="button" tabindex="0">
        <div class="dd-item-header">
          <span class="dd-item-kind dd-kind-${r.kind}">${r.kind}</span>
          <span class="dd-item-name">${escapeHtml(r.name)}</span>
          <span style="font-size:0.75rem;color:#64748b;font-family:monospace;">${r.module}</span>
        </div>
        ${r.signature ? `<div class="dd-item-sig">${escapeHtml(r.signature)}</div>` : ''}
        ${r.doc ? `<div class="dd-item-doc">${escapeHtml(r.doc)}</div>` : ''}
        <div class="dd-item-loc">${r.file}:${r.line}</div>
      </div>`;
    });
    content.innerHTML = html;
    content.querySelectorAll('.dd-item[data-mi]').forEach((el) => {
      const open = () => {
        document.getElementById('dd-search').value = '';
        document.querySelectorAll('.dd-module').forEach((modEl) => { modEl.style.display = ''; });
        selectModule(Number(el.dataset.mi), el.dataset.item);
      };
      el.addEventListener('click', open);
      el.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); }
      });
    });
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
</script>
