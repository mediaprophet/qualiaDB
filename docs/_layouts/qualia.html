<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} · {% endif %}Qualia-DB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ '/css/site-nav.css' | relative_url }}">
    <script src="{{ '/js/menu-loader.js' | relative_url }}"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .doc-content { max-width: 52rem; }
        .doc-content h1 { font-size: 2rem; font-weight: 700; margin-bottom: 1rem; }
        .doc-content h2 { font-size: 1.35rem; font-weight: 600; margin-top: 2rem; margin-bottom: 0.75rem; color: #e2e8f0; }
        .doc-content h3 { font-size: 1.1rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.5rem; color: #cbd5e1; }
        .doc-content p, .doc-content li { color: #cbd5e1; line-height: 1.7; }
        .doc-content a { color: #22d3ee; text-decoration: underline; }
        .doc-content code { font-family: ui-monospace, monospace; font-size: 0.9em; background: rgba(15,23,42,0.8); padding: 0.1rem 0.35rem; border-radius: 0.25rem; }
        .doc-content pre { background: rgba(10,14,23,0.9); border: 1px solid rgba(148,163,184,0.15); border-radius: 0.75rem; padding: 1rem; overflow-x: auto; }
        .doc-content pre code { background: transparent; padding: 0; }
        .doc-content table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.9rem; }
        .doc-content th, .doc-content td { border: 1px solid rgba(148,163,184,0.15); padding: 0.5rem 0.75rem; text-align: left; }
        .doc-content th { background: rgba(30,41,59,0.6); color: #94a3b8; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen">
    <nav class="sticky top-0 z-50 border-b border-white/10" style="background:rgba(17,23,31,0.88);backdrop-filter:blur(32px)">
        <div class="max-w-screen-2xl mx-auto px-4 sm:px-8">
            <div class="flex items-center justify-between h-14 gap-4">
                <a href="{{ '/index.html' | relative_url }}" class="flex items-center gap-3 shrink-0">
                    <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-cyan-400 rounded-xl flex items-center justify-center">
                        <span class="text-black font-bold text-xl">Q</span>
                    </div>
                    <div class="hidden sm:block"><span class="font-semibold text-xl">Qualia</span><span class="text-blue-400 text-xl">DB</span></div>
                </a>
                <div id="dynamic-nav" class="relative flex items-center text-sm min-w-0 flex-1 justify-end lg:justify-center"></div>
                <a href="https://github.com/mediaprophet/qualiaDB/releases" target="_blank"
                   class="hidden sm:flex items-center gap-2 px-3 py-2 text-sm hover:bg-white/5 rounded-2xl transition-colors shrink-0">
                    <i class="fab fa-github"></i><span>GitHub</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-screen-2xl mx-auto px-6 sm:px-8 py-10">
        <article class="doc-content mx-auto">
            {{ content }}
        </article>
    </main>

    <footer class="border-t border-white/10 mt-12 py-8 text-center text-slate-500 text-sm">
        <div class="flex flex-wrap justify-center gap-6 mb-4"></div>
        <p>Qualia-DB · Human-centric semantic engine</p>
    </footer>
</body>
</html>
