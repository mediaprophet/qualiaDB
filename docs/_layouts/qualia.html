<!DOCTYPE html>
<html lang="en" data-theme="release-038">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} · {% endif %}Qualia-DB</title>
    <link rel="stylesheet" href="{{ '/css/tailwind-built.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/css/release-showcase.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ '/css/site-nav.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="{{ '/js/menu-loader.js' | relative_url }}"></script>
</head>
<body class="min-h-screen">
    <div class="q-mesh" aria-hidden="true"></div>
    <nav class="sticky top-0 z-50 border-b border-white/10" style="background:rgba(7,8,12,0.82);backdrop-filter:blur(32px)">
        <div class="max-w-screen-2xl mx-auto px-4 sm:px-8">
            <div class="flex items-center justify-between h-14 gap-4">
                <a href="{{ '/index.html' | relative_url }}" class="flex items-center gap-3 shrink-0">
                    <div class="w-8 h-8 bg-gradient-to-br from-emerald-400 to-cyan-500 rounded-xl flex items-center justify-center">
                        <span class="text-black font-bold text-xl">Q</span>
                    </div>
                    <div class="hidden sm:block"><span class="font-semibold text-xl">Qualia</span><span class="text-emerald-400 text-xl">DB</span></div>
                </a>
                <div id="dynamic-nav" class="relative flex items-center text-sm min-w-0 flex-1 justify-end lg:justify-center"></div>
                <a href="https://github.com/mediaprophet/qualiaDB/releases" target="_blank"
                   class="hidden sm:flex items-center gap-2 px-3 py-2 text-sm hover:bg-white/5 rounded-2xl transition-colors shrink-0">
                    <i class="fab fa-github"></i><span>GitHub</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="q-wrap max-w-screen-2xl mx-auto px-5 sm:px-8 py-10">
        <p class="mb-5 text-sm"><a class="q-link" href="{{ '/qdnf.html' | relative_url }}">QDNF map</a>
            · <a class="q-link" href="{{ '/read.html' | relative_url }}">Readable docs</a></p>
        <article class="doc-content q-prose q-card mx-auto p-6 sm:p-10">
            {{ content }}
        </article>
    </main>

    <footer class="q-site-footer">
        <div class="flex flex-wrap justify-center gap-6 mb-4"></div>
        <p>Qualia-DB · Human-centric semantic engine · handle ≠ human</p>
    </footer>
    <script src="{{ '/js/markdown-doc.js' | relative_url }}" data-mode="rewrite"></script>
</body>
</html>
