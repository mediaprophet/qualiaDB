# Concatenated with .cargo/config.toml rustflags. Include the getrandom
# wasm_js cfg here so production-core wasm checks stay correct even if
# config.toml is edited. Include -C debuginfo=0 in this list rather than
# setting exclusive RUSTFLAGS (which would drop the cfg).
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"', '-C', 'debuginfo=0']

# Local Etalon N3 (`anvil_bind`). Git pin `a8f12b3` does not export that module.
[build]
rustflags = ['--cfg', 'anvil_n3_bind']

